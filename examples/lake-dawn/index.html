<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lake at dawn</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;margin:0 auto;max-width:100vw;max-height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =====================================================================
   Lake at dawn, a Sketch to painting film (framewright): a mountain lake at sunrise, 15 s.
   One file, one canvas. A frame is a pure function of (frame number, seed, width). No images, no video,
   no base64, no CDN. The painting is built once per (seed, width) from cached layers of brush marks.
   The painting kit block is the skill's (assets/painting.html; method in references/painting.md); the scene block is
   this film's own.
   URL knobs:  ?f=140  ?s=12  ?w=1920  ?grid=24  ?cw=480  ?from=60&to=180  ?ar=16:9
   Layout: params -> generators -> math -> helpers -> painting kit -> scene -> engine -> plates -> boot.
   Keep every helper ABOVE the plates block.
   ===================================================================== */

/* ---------- parameters ---------- */
const Q = new URLSearchParams(location.search);
const FPS = 30, BPM = 120;
const BEAT = Math.round(FPS * 60 / BPM), BAR = BEAT * 4;   // 120 BPM -> beat 15 frames, bar 60
const SHORT = 1080;                                        // logical short side, all geometry lives here
function parseAR(s){ const m=/^(\d+(?:\.\d+)?)[:x\/](\d+(?:\.\d+)?)$/.exec(s||''); return m ? (+m[1])/(+m[2]) : 16/9; }
const AR = parseAR(Q.get('ar') || '16:9');
const LW = AR >= 1 ? Math.round(SHORT*AR) : SHORT;         // logical width
const LH = AR >= 1 ? SHORT : Math.round(SHORT/AR);         // logical height
const CX = LW/2, CY = LH/2;
const SEED  = +(Q.get('s') || 7);
const WIDTH = +(Q.get('w') || 1920);
const SAFE  = 0.08;
const TITLE_Y = AR < 1 ? 0.70 : 0.80;

/* ---------- generators ---------- */
function hash(){ // any arguments -> 32-bit seed
  let h = 2166136261 >>> 0;
  for (let k=0;k<arguments.length;k++){ const s=String(arguments[k])+'|';
    for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } }
  h ^= h>>>13; h = Math.imul(h, 0x5bd1e995); h ^= h>>>15;
  return h >>> 0;
}
function rng(seed){ // sfc32
  let a=seed>>>0, b=0x9e3779b9, c=0x6a09e667, d=0xbb67ae85;
  const f=()=>{ a>>>=0;b>>>=0;c>>>=0;d>>>=0; let t=(a+b)|0; a=b^(b>>>9); b=(c+(c<<3))|0; c=(c<<21)|(c>>>11); d=(d+1)|0; t=(t+d)|0; c=(c+t)|0; return (t>>>0)/4294967296; };
  for(let i=0;i<12;i++) f();
  return {
    f, r:(lo,hi)=>lo+(hi-lo)*f(), i:(n)=>Math.floor(f()*n), pick:(arr)=>arr[Math.floor(f()*arr.length)],
    sign:()=>f()<0.5?-1:1, chance:(p)=>f()<p,
    g:()=>{ let u=0,v=0; while(u===0)u=f(); while(v===0)v=f(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
  };
}

/* ---------- math ---------- */
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const span=(f,a,b)=>clamp((f-a)/(b-a));                    // progress of f between a and b, 0..1
const smooth=t=>{t=clamp(t);return t*t*(3-2*t)};
const sstep=(a,b,x)=>smooth((x-a)/(b-a));                  // smoothstep from a to b (a > b runs downhill)
const ease=Object.freeze({
  out:t=>1-Math.pow(1-clamp(t),3), in:t=>Math.pow(clamp(t),3),
  io:t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
});
const pad=(n,w=2)=>String(n).padStart(w,'0');
const TAU=Math.PI*2, DEG=Math.PI/180;

/* ---------- canvas pool ---------- */
const POOL={};
function cvs(name,w,h){ let c=POOL[name]; if(!c){ c=document.createElement('canvas'); c.getContext('2d',{willReadFrequently:true}); POOL[name]=c; } if(c.width!==w||c.height!==h){ c.width=w; c.height=h; } return c; }
/* a pooled canvas keeps its context from frame to frame: wipe it before drawing */
function wipe(g){ if(g.reset) g.reset(); else g.canvas.width=g.canvas.width; return g; }

/* ---------- palette ---------- */
const COL=Object.freeze({ bg:'#F2EBDC', paper:'#F2EBDC', ink:'#30281D' });

/* =====================================================================
   HELPERS (all above the plates block)
   ===================================================================== */

/* ---- deterministic per-pixel finisher (none for this style: no grain, no vignette, no grade over the paint) ---- */
function post(src,dst,S,o={}){
  const W=src.width,H=src.height, sg=src.getContext('2d'), dg=wipe(dst.getContext('2d'));
  const grain=(o.grain??0)*(S.grain??1), vig=o.vig??0;
  if(!grain && !vig){ dg.drawImage(src,0,0); return; }
  const id=sg.getImageData(0,0,W,H), d=id.data, cx=(W-1)/2, cy=(H-1)/2;
  let z=hash(S.seed,'grain',S.f)|0;
  for(let y=0;y<H;y++){ const ny=(y-cy)/cy;
    for(let x=0;x<W;x++){ const i=(y*W+x)*4; const nx=(x-cx)/cx, r2=nx*nx+ny*ny;
      z=(Math.imul(z,1664525)+1013904223)|0; const gn=((z>>>24)/255-0.5)*grain; const v=1-vig*Math.pow(r2*0.5,1.4);
      d[i]=clamp(d[i]*v+gn,0,255); d[i+1]=clamp(d[i+1]*v+gn,0,255); d[i+2]=clamp(d[i+2]*v+gn,0,255); } }
  dg.putImageData(id,0,0);
}

/*PORTRAIT_START*/
const PORTRAIT={"w":1,"h":1,"levels":[]};
/*PORTRAIT_END*/

/* ===== painting kit ===== */
/* A painting film shows one oil painting in three media without a cut: a pencil drawing computed from the painting
   appears on blank paper, the painting washes in over it and finishes, then the painting comes alive under a slow
   push-in. The painting is built once per (seed, width) from cached layers of brush marks; after that a frame is a few
   blits, two 1/4-resolution masks and the marks that move. Method, recipes, costs and review: references/painting.md.
   drawPainting(S) draws any frame of it; every plate calls it. This block knows nothing of the scene: regions,
   colours and builders live in the object SCENE (scene block below), which provides
     horizon        y of the horizon as a fraction of the height: depth() and persp() scale marks from it
     tRef           the film time (s) handed to live() while the still is composed (at rest: tau 0, life 0)
     layers         back to front: [{name, rect(), paint(g, R, K, parts), parts, drift, flow, alpha, clip, live}]
                      rect() -> [x, y, w, h] in logical px: the cache's extent (only with paint)
                      paint(g, R, K, parts): builds the cache once; R its generator, K the kit (K.L holds the layers
                        built before this one, K.seed, K.W), parts the contexts of its parts
                      parts [{rect(), drift(tau, life)}]: extra canvases painted in the same pass that move on their own
                      drift, flow, alpha: how the cached layer moves when alive (drawLayer)
                      clip: a polygon in logical px the layer is clipped to
                      live(g, K, tau, life, t): marks drawn every frame, and once at rest into the still
                    A layer without paint is live only.
     prepare(K)     runs before any layer is painted: lists of live marks, sprites, shared fields
   and optionally
     life {ramp}, camera {cue, rate, ease, focus}, wind {f, swell, hi, noise, am, pm}   override LIFE key by key
     pencil {v, blur, gain(x, y), o}      a per-region pencil gain (a 1/4-res field blurred by `blur` cells, cached
                                          under version v) and o, overrides of PENCIL
     reveal {v, blur, settle, sketch, colour, offset: {sketch(x, y), colour(x, y)}}   merged key by key into REVEAL
                                          (colour.finish too, so {colour: {finish: {kmax: 0.15}}} keeps the rest);
                                          offsets are frames added to a time field before its floor and ceiling, so
                                          parts of the picture arrive earlier or later
     curves(K, f, tau, life) -> {...}     extra per-frame fields for the sound
   Cues it reads: wash (colour starts), finish (the global finish starts), step (a one-frame step of the colour),
   done (paint complete: the still), alive (life ramps in) and the camera's cue (push). marks is the sound's: the
   REVEAL defaults put the first ink on the paper there. The REVEAL time fields are in absolute frames, tuned for
   marks f6, wash f60, finish f73, step f87, done f98, alive f105 (plates of 60 and 45 frames before the living one);
   a film that moves these cues moves t0, lo and hi of SCENE.reveal.sketch and .colour with them.
   Rules: geometry in logical units; randomness only from rng(hash(seed, name, ...)); every cache keyed by all its
   inputs and never a pooled canvas; caches built from fixed inputs only; getImageData only while building. */
const PAINT_V=1;                 // recipe version: part of every cache key and of every layer's seed (a new value repaints every mark)
const OVER=1.14;                 // caches are built this much larger than the output: a push-in up to x1.14 never upsamples

/* ---- colour: [r, g, b] arrays, 0..255 ---- */
const hexc=h=>{ const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; };
const C=c=>typeof c==='string'?hexc(c):c;
const mixc=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const css=(c,a=1)=>{ const r=clamp(c[0],0,255)|0, g=clamp(c[1],0,255)|0, b=clamp(c[2],0,255)|0;
  return a>=1?`rgb(${r},${g},${b})`:`rgba(${r},${g},${b},${Math.round(clamp(a)*1000)/1000})`; };
function rgb2hsl(c){ const r=c[0]/255,g=c[1]/255,b=c[2]/255, mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2; let h=0,s=0;
  if(mx!==mn){ const d=mx-mn; s=l>0.5?d/(2-mx-mn):d/(mx+mn); h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4; h*=60; } return [h,s,l]; }
function hsl2rgb(h,s,l){ h=((h%360)+360)%360; const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2; let r,g,b;
  if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;} else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
  return [(r+m)*255,(g+m)*255,(b+m)*255]; }
const hsl=(c,dh=0,ds=0,dl=0)=>{ const q=rgb2hsl(C(c)); return hsl2rgb(q[0]+dh,clamp(q[1]+ds),clamp(q[2]+dl)); };
const JIT=[4,0.06,0.05];                                   // per-dab jitter: hue deg, saturation, lightness
const jit=(c,R,j=JIT)=>hsl(c,R.r(-j[0],j[0]),R.r(-j[1],j[1]),R.r(-j[2],j[2]));
/* a colour ramp through [v, colour] stops */
function ramp(st){ const S=st.map(([v,c])=>[v,C(c)]);
  return v=>{ if(v<=S[0][0]) return S[0][1]; for(let i=1;i<S.length;i++) if(v<=S[i][0]){ const a=S[i-1], b=S[i]; return mixc(a[1],b[1],(v-a[0])/(b[0]-a[0])); } return S[S.length-1][1]; }; }
/* pick from a palette by a noise value v in about -1..1 (clusters of the same colour where v is smooth) */
const pickPal=(pal,v)=>pal[clamp(Math.floor((v*0.5+0.5)*pal.length),0,pal.length-1)];

/* ---- value noise on a seeded 256x256 lattice table (a hash per lookup is 50x slower); range about -1..1 ---- */
const NOISE=new Map();
function noise(seed){ let n=NOISE.get(seed); if(n) return n;
  const R=rng(seed), T=new Float32Array(65536); for(let i=0;i<65536;i++) T[i]=R.f()*2-1;
  n=(x,y)=>{ const xf=Math.floor(x), yf=Math.floor(y), fx=x-xf, fy=y-yf, u=fx*fx*(3-2*fx), v=fy*fy*(3-2*fy);
    const x0=xf&255, x1=(xf+1)&255, y0=(yf&255)<<8, y1=((yf+1)&255)<<8, a=T[y0|x0], b=T[y0|x1], c=T[y1|x0], d=T[y1|x1];
    return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; };
  n.fbm=(x,y,o=3)=>{ let s=0,a=1,t=0; for(let k=0;k<o;k++){ s+=a*n(x,y); t+=a; a*=0.5; x=x*2.03+17.1; y=y*2.03+31.7; } return s/t; };
  NOISE.set(seed,n); return n; }

/* ---- geometry: polygons and polylines in logical units ---- */
const toL=pts=>pts.map(p=>[p[0]*LW,p[1]*LH]);
function inPoly(P,x,y){ let o=false; for(let i=0,j=P.length-1;i<P.length;j=i++){ const xi=P[i][0], yi=P[i][1], xj=P[j][0], yj=P[j][1];
  if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi)) o=!o; } return o; }
function segDist(px,py,ax,ay,bx,by){ const vx=bx-ax, vy=by-ay, u=clamp(((px-ax)*vx+(py-ay)*vy)/((vx*vx+vy*vy)||1)); return Math.hypot(px-ax-u*vx,py-ay-u*vy); }
function lineDist(L,x,y,closed=false){ let d=1e9; const n=L.length, m=closed?n:n-1;
  for(let i=0;i<m;i++){ const a=L[i], b=L[(i+1)%n], e=segDist(x,y,a[0],a[1],b[0],b[1]); if(e<d) d=e; } return d; }
const sdPoly=(P,x,y)=>inPoly(P,x,y)?-lineDist(P,x,y,true):lineDist(P,x,y,true);
function bbox(P){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const p of P){ if(p[0]<x0)x0=p[0]; if(p[1]<y0)y0=p[1]; if(p[0]>x1)x1=p[0]; if(p[1]>y1)y1=p[1]; } return {x0,y0,x1,y1}; }
/* y of a polyline sorted by x, at x (held flat past the ends); and its direction there in radians */
function yOn(L,x){ if(x<=L[0][0]) return L[0][1]; for(let i=1;i<L.length;i++) if(x<=L[i][0]){ const a=L[i-1], b=L[i]; return lerp(a[1],b[1],(x-a[0])/((b[0]-a[0])||1)); } return L[L.length-1][1]; }
function angOn(L,x){ let i=1; while(i<L.length-1&&x>L[i][0]) i++; const a=L[i-1], b=L[i]; return Math.atan2(b[1]-a[1],b[0]-a[0]); }
/* Chaikin corner cutting: a smooth polyline through a few hand-placed points (ends kept) */
function smoothLine(L,it=2){ let P=L; for(let k=0;k<it;k++){ const Q=[P[0]]; for(let i=0;i<P.length-1;i++){ const a=P[i], b=P[i+1];
  Q.push([a[0]*0.75+b[0]*0.25,a[1]*0.75+b[1]*0.25],[a[0]*0.25+b[0]*0.75,a[1]*0.25+b[1]*0.75]); } Q.push(P[P.length-1]); P=Q; } return P; }
function pathPoly(g,P,close=true){ g.beginPath(); g.moveTo(P[0][0],P[0][1]); for(let i=1;i<P.length;i++) g.lineTo(P[i][0],P[i][1]); if(close) g.closePath(); }
/* resample a polyline by arc length: [{x, y, tx, ty (unit tangent), s (0..1)}] */
function resample(L,step){ const d=[0]; for(let i=1;i<L.length;i++) d.push(d[i-1]+Math.hypot(L[i][0]-L[i-1][0],L[i][1]-L[i-1][1]));
  const tot=d[d.length-1], n=Math.max(2,Math.ceil(tot/step)), out=[]; let j=1;
  for(let k=0;k<=n;k++){ const s=k/n*tot; while(j<L.length-1&&d[j]<s) j++; const a=L[j-1], b=L[j], u=(s-d[j-1])/((d[j]-d[j-1])||1), l=Math.hypot(b[0]-a[0],b[1]-a[1])||1;
    out.push({x:lerp(a[0],b[0],u),y:lerp(a[1],b[1],u),tx:(b[0]-a[0])/l,ty:(b[1]-a[1])/l,s:k/n}); }
  return out; }
const depth=y=>clamp((y/LH-SCENE.horizon)/(1-SCENE.horizon));   // 0 at the horizon, 1 at the bottom edge
const persp=y=>0.4+0.8*depth(y);                                 // mark size (and later speed) factor with distance

/* ---- cached layers: built once on their own canvas, never drawn into again, keyed by every input ----
   parts (optional): rects of extra canvases built in the same pass with the same generator, so a layer's marks can be split
   into pieces that move differently later (the sky's cloud marks drift, its base does not) and the still stays identical;
   build receives their contexts as its 4th argument, and the canvas carries them as c.parts */
const LAYERS=new Map();                                          // separate from POOL: pooled canvases are rewritten every frame
function layer(name,deps,rect,build,parts=null){
  const key=name+'|'+JSON.stringify(deps)+'|'+rect.map(v=>Math.round(v)).join(',')+(parts?'|'+parts.map(r=>r.map(v=>Math.round(v)).join(',')).join(';'):'');
  let c=LAYERS.get(key); if(c) return c;
  const s=deps.W/LW*deps.over, mk=r=>{ const k=document.createElement('canvas'); k.width=Math.max(1,Math.ceil(r[2]*s)); k.height=Math.max(1,Math.ceil(r[3]*s));
    const g=k.getContext('2d',{willReadFrequently:true}); g.setTransform(s,0,0,s,-r[0]*s,-r[1]*s); g.lineCap='round'; g.lineJoin='round'; k.rect=r; k.s=s; return [k,g]; };
  const [c0,g]=mk(rect), P=parts?parts.map(mk):null; c=c0;
  build(g,rng(hash(deps.seed,name,deps.v)),s,P?P.map(p=>p[1]):null);
  if(P) c.parts=P.map(p=>p[0]);
  c.key=key; LAYERS.set(key,c); return c; }
function blit(g,c,dx=0,dy=0){ g.drawImage(c,c.rect[0]+dx,c.rect[1]+dy,c.width/c.s,c.height/c.s); }
/* a base coat: colour fn(x, y) sampled every `cell` px over a logical rect, smoothed by the upscale */
function fieldFill(g,rect,fn,cell=8){ const w=Math.ceil(rect[2]/cell)+2, h=Math.ceil(rect[3]/cell)+2, c=document.createElement('canvas'); c.width=w; c.height=h;
  const cg=c.getContext('2d'), id=cg.createImageData(w,h), d=id.data;
  for(let j=0;j<h;j++) for(let i=0;i<w;i++){ const col=fn(rect[0]+(i-0.5)*cell,rect[1]+(j-0.5)*cell), k=(j*w+i)*4; d[k]=col[0]; d[k+1]=col[1]; d[k+2]=col[2]; d[k+3]=255; }
  cg.putImageData(id,0,0); g.save(); g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high'; g.drawImage(c,rect[0]-cell,rect[1]-cell,w*cell,h*cell); g.restore(); }

/* a colour field given on a coarse grid (colours picked from a study): xs, ys normalised sample positions, rows[j][i] hex -> fn(x, y logical), bilinear */
function gridField(xs,ys,rows){ const T=rows.map(r=>r.map(C));
  const idx=(a,v)=>{ if(v<=a[0]) return [0,0]; for(let i=1;i<a.length;i++) if(v<=a[i]) return [i-1,(v-a[i-1])/(a[i]-a[i-1])]; return [a.length-2,1]; };
  return (x,y)=>{ const [i,u]=idx(xs,x/LW), [j,v]=idx(ys,y/LH); return mixc(mixc(T[j][i],T[j][i+1],u),mixc(T[j+1][i],T[j+1][i+1],u),v); }; }
/* scalar fields on a 1/4-resolution logical grid (cell 4 px): resolution-independent, cached by name and inputs */
const FIELDS=new Map(), FCELL=4;
function field(name,deps,build){ const key=name+'|'+JSON.stringify(deps); let F=FIELDS.get(key); if(F) return F;
  const gw=Math.ceil(LW/FCELL)+1, gh=Math.ceil(LH/FCELL)+1; F={gw,gh,a:new Float32Array(gw*gh)}; build(F); FIELDS.set(key,F); return F; }
function fAt(F,x,y,a=F.a){ const fx=clamp(x/FCELL,0,F.gw-1.001), fy=clamp(y/FCELL,0,F.gh-1.001), i=fx|0, j=fy|0, u=fx-i, v=fy-j, k=j*F.gw+i;
  return a[k]*(1-u)*(1-v)+a[k+1]*u*(1-v)+a[k+F.gw]*(1-u)*v+a[k+F.gw+1]*u*v; }
/* separable box blur of a Float32 grid, `passes` times (3 passes of radius r ~ a Gaussian of sigma sqrt(r(r+1))) */
function blurField(F,r,passes=3){ const {gw,gh}=F, a=F.a, b=new Float32Array(a.length), k=1/(2*r+1);
  for(let p=0;p<passes;p++){
    for(let y=0;y<gh;y++){ const o=y*gw; let s=0; for(let x=-r;x<=r;x++) s+=a[o+clamp(x,0,gw-1)]; for(let x=0;x<gw;x++){ b[o+x]=s*k; s+=a[o+Math.min(gw-1,x+r+1)]-a[o+Math.max(0,x-r)]; } }
    for(let x=0;x<gw;x++){ let s=0; for(let y=-r;y<=r;y++) s+=b[clamp(y,0,gh-1)*gw+x]; for(let y=0;y<gh;y++){ a[y*gw+x]=s*k; s+=b[Math.min(gh-1,y+r+1)*gw+x]-b[Math.max(0,y-r)*gw+x]; } } }
  return F; }

/* ---- marks ---- */
const DX=new Float32Array(24), DY=new Float32Array(24), DW=new Float32Array(24), TAPER=[0.6,1,0.7];
/* dab: a bent, tapered quad with rounded ends (a knife or brush plateau), filled with col jittered in HSL.
   o.imp 0..1: impasto ridges, a lit edge +12 % lightness at alpha 0.34 x imp on the side facing the light (upper left)
   and a dark edge -15 % at alpha 0.24 x imp on the other; o.ridgeP: share of dabs that get them; o.bend (fraction of
   len), o.alpha, o.jit ([hue, sat, light] or 0), o.taper [start, middle, end], o.ridge (ridge width).
   o.rag 0..1: ragged knife edges (12 outline samples, each half-width scaled by 1 +- rag/2).
   o.br 0..1: bristle marks, 3-5 hairlines (0.7-1.8 px, at most 0.7 of the half-width) along the bent axis inside the
   dab, lighter or darker by 6-12 % at alpha 0.35-0.55 (scaled by br); o.brP: share of dabs that get them (cost). Returns the colour it painted. */
function dab(g,x,y,len,wid,ang,col,R,o={}){

/* blade: a grass blade, a tapered quadratic curve from its root; width w0 at the root to w0*o.tip at the tip; the tip

/* paint a region: a jittered grid of dabs at about `cover` x coverage inside its polygon; angle = flow + low-frequency

/* ---- the kit: every cache of one (seed, width), and the painting composed from it ---- */
const KITS=new Map();
function kit(seed,W){

  const deps={seed,W,ar:+AR.toFixed(5),over:OVER,v:PAINT_V};

  if(SCENE.prepare) SCENE.prepare(K);                      // shared fields the builders read (noise, distance to shore, sprites)
  for(const Ly of SCENE.layers) if(Ly.paint) K.L[Ly.name]=layer(Ly.name,deps,Ly.rect(),(g,R,s,P)=>Ly.paint(g,R,K,P),Ly.parts?Ly.parts.map(p=>p.rect()):null);

/* the living painting: tau = the life clock (s), life = the amplitude L, t = the film time (s; the wind reads it). K.still is

/* ---- life and camera ----

   edges, which a fade over still frames hides, so life starts at full strength on its cue with no step. The camera is a
   push-in about `focus` (fractions of the frame) from its cue: z = exp(rate * tc), tc = d^2 / (2 E) during the ease-in
   (E = ease frames), then E/2 + (d - E), in frames / FPS; rate 0.01359 reaches x1.136 about 9.8 s after the cue, so the
   end zoom stays under OVER. Every layer is drawn from its OVER-size cache under that transform (and so are the drawing
   and the reveal masks), so the push-in never resamples a finished frame. The wind, gust(t, seed), is one signal for the
   picture and the sound, about -2..2: a carrier of f Hz whose amplitude (am: [period s, depth]) and phase (pm: [period s,

   ([period s, amplitude]). SCENE.life / camera / wind override LIFE key by key. */

const GUSTS=new Map();

  const w=G.w, am=w.am?1+w.am[1]*G.n(t/w.am[0],3.7):1, pm=w.pm?w.pm[1]*G.n(t/w.pm[0],9.1):0;   // the carrier's amplitude and phase wander (a gust, not a metronome)

const FT=[], FR=[]; for(let k=0;k<=8;k++){ const t=k/4-1; FT.push(t); FR.push(Math.sqrt(Math.max(0,1-Math.pow(Math.abs(t),6)))); }   // dabFast's fixed samples

  g.beginPath(); for(let k=1;k<8;k++){ const px=DX[k]+sd*s*DW[k]*0.8, py=DY[k]-sd*c*DW[k]*0.8; k>1?g.lineTo(px,py):g.moveTo(px,py); } g.strokeStyle=dark; g.stroke(); }
/* ---- marks carried by a moving phase field (surf, drifting foam) ----

/* ---- the drawing: a pencil filter of the painting (a colour dodge of the luma by its inverted, blurred copy) ----

const PENCIL=Object.freeze({ sigma:8, gamma:1.8, fine:[2,1.2], fine1:[1,0.8], lift:[0.35,0.05], tone:[0.05,1.8], grain:[0.6,2,1.2,0.6],

   the scene's own fields from SCENE.curves(K, f, tau, life) (a foam share, a count of births). Evaluated from the time fields and the life clock (the scene's curves may read the kit built at 320 px). */
function paintingCurves(seed){ const RF=revealFields(seed), sk=RF.RV.sketch, co=RF.RV.colour, K=kit(seed,320), out=[];
  const share=(F,f,o)=>{ const a=F.a, hw=o.hw; let s=0; for(let k=0;k<a.length;k+=7){ const u=(f-a[k]+hw)/(2*hw); s+=u<=0?0:u>=1?1:u*u*(3-2*u); } return s/Math.ceil(a.length/7); };
  for(let f=0;f<TOTAL();f++){ const L=lifeAt(f), tau=lifeClock(f), fo=finishOf(f,co.finish);
    const r={ f, sketch:+(f>=cue('wash')?1:share(RF.Ts,f,sk)).toFixed(4), colour:+(f<cue('wash')?0:f>=cue('done')?1:share(RF.Tc,f,co)*fo.cap).toFixed(4),
      life:+L.toFixed(4), gust:+gust(f/FPS,seed).toFixed(4), z:+camAt(f).z.toFixed(5) };
    if(SCENE.curves) Object.assign(r,SCENE.curves(K,f,tau,L));
    out.push(r); }
  return out; }
/* one frame of the painting film: every plate calls this. Paper -> the drawing uncovered by Ts -> the painting over the
   whole drawing through Tc and the two-stage cap -> from `done` the still, settling and fading into its living layers at
   rest until `alive` -> from `alive` the living painting (life clock, amplitude, wind), all under the camera. */
/* the still over the page's background colour, opaque (the still has a few see-through specks where no layer covers the
   paper; the living frames' cross-fade must hide what lies under them too). Built from the still, cached */
function stillOnPaper(K){ return layer('stillPaper',K.deps,[0,0,LW,LH],g=>{ g.fillStyle=COL.bg; g.fillRect(0,0,LW,LH); blit(g,K.still); }); }
function drawPainting(S){
  const K=kit(S.seed,S.cv.width), g=S.g, f=S.f, set=(SCENE.reveal&&SCENE.reveal.settle)??REVEAL.settle, d=set*sstep(cue('finish'),cue('step'),f)*(1-sstep(cue('done'),cue('alive'),f));
  const cam=camAt(f), L=lifeAt(f); camSet(g,S.cv.width/LW,cam);
  if(f>=cue('done')){ composeLive(g,K,lifeClock(f),L,f/FPS);
    const a=cue('done'), b=cue('alive'), xf=f<b?1-(f-a)/(b-a):0; if(xf>0){ g.globalAlpha=xf; blit(g,stillOnPaper(K)); g.globalAlpha=1; }   // done -> alive: the still fades into its living layers at rest (no step when life starts)
    desat(g,d); return; }
  const Rv=reveals(K), sk=Rv.RV.sketch, co=Rv.RV.colour;
  if(f<cue('wash')){ drawField(g,Rv.paper); through(g,Rv.sketch,maskAt(0,Rv.Ts,f,sk),0); }
  else { const fo=finishOf(f,co.finish); blit(g,Rv.sketch); through(g,K.still,maskAt(1,Rv.Tc,f,{hw:co.hw,blur:co.blur,cap:fo.cap,fin:fo.fin}),1,d); }
}
/* ===== end painting kit ===== */

/* ===== scene ===== */
/* Lake at dawn. A calm mountain lake at sunrise, in impasto knife and brush marks: the sun above a saddle between
   three ridges in aerial perspective, mist on the far water, the lake mirroring all of it, a birch on the left, reeds
   along the edges, a weathered jetty with a moored rowing boat on the right. Coordinates are normalised to the 16:9
   frame (x, y from the top left). Layers back to front: sky (cloud marks drift), sun, birds (live), ridges, mist
   (drifts, breathes), lake (a painted mirror, drawn in trembling strips when alive, plus fading glitter), boat (bobs),
   jetty, reeds behind, birch, reeds in front (sway with the gust), birch foliage (tufts on the same gust, later). */
const SCENE=(()=>{
  const S={ horizon:0.47, sun:[0.62,0.305], sunR:30, tRef:0,

         [0.53,0.35],[0.58,0.362],[0.62,0.368],[0.66,0.358],[0.70,0.335],[0.74,0.30],[0.78,0.265],[0.82,0.24],[0.85,0.228],[0.88,0.24],[0.92,0.27],[0.97,0.295],[1.02,0.31]],
    mid:[[-0.02,0.35],[0.05,0.335],[0.11,0.33],[0.18,0.345],[0.26,0.37],[0.34,0.392],[0.42,0.405],[0.50,0.415],[0.56,0.418],[0.62,0.414],[0.68,0.402],
         [0.75,0.382],[0.82,0.366],[0.88,0.362],[0.94,0.372],[1.02,0.385]],
    nearL:[[-0.02,0.385],[0.04,0.378],[0.10,0.385],[0.17,0.405],[0.24,0.425],[0.31,0.44],[0.38,0.455],[0.44,0.466],[0.49,0.472]],
    nearR:[[0.70,0.472],[0.76,0.458],[0.82,0.44],[0.88,0.422],[0.94,0.41],[1.02,0.402]],
  };
  S.lines=LN;
  const Hn=S.horizon, sunXY=()=>[S.sun[0]*LW,S.sun[1]*LH];
  const under=(L,y1)=>{ const P=toL(L); return P.concat([[P[P.length-1][0],y1*LH],[P[0][0],y1*LH]]); };

  /* ---- sky: rose and peach near the horizon, pale lilac-blue above, a warm glow around the sun ---- */
  const skyRamp=ramp([[0,'#A7B2CE'],[0.28,'#C4B6CB'],[0.52,'#E4AFA4'],[0.72,'#F0BA9F'],[0.88,'#F5CDAE'],[1,'#F7DCBC']]);
  function skyCol(x,y){ const [sx,sy]=sunXY(), c=skyRamp(clamp(y/(Hn*LH))), r=Math.hypot((x-sx)/LW,(y-sy)/LH*0.9);
    return mixc(mixc(c,C('#FBE3B8'),0.75*Math.exp(-r*r/0.012)),C('#FFF3D6'),0.8*Math.exp(-r*r/0.0012)); }
  function paintSky(g,R,K,P){

  /* cumulus: clusters of dabs, lit on top (toward the low sun at the right: warmer), rose-lilac bellies; low streaks */
  function paintClouds(g,R,K,band){ const nzc=noise(hash(K.seed,'cloud',band)), [sx,sy]=sunXY();
    const groups=band==='hi'?[[0.08,0.10,0.09,0.035],[0.25,0.07,0.11,0.04],[0.44,0.12,0.08,0.03],[0.58,0.06,0.10,0.035],[0.79,0.10,0.09,0.035],[0.97,0.07,0.08,0.03],[0.35,0.18,0.07,0.025],[0.86,0.17,0.07,0.025]]

    const gr=g.createRadialGradient(sx,sy,0,sx,sy,r*4.2); gr.addColorStop(0,'rgba(255,250,228,1)'); gr.addColorStop(0.25,'rgba(255,238,190,0.8)'); gr.addColorStop(0.5,'rgba(255,226,170,0.35)'); gr.addColorStop(1,'rgba(255,220,170,0)');

        return mixc(mixc(mixc(C('#6F6789'),C('#8E83A2'),0.5+0.4*v),C('#C9ABB5'),0.5*t),C('#D8A99A'),0.3*warm); },

  /* ---- mist: soft wide horizontal wisps over the far water ---- */
  function paintMist(g,R,K){ const nm=noise(hash(K.seed,'mist'));

  /* ---- the lake: a mirror of the sky, sun and ridges about the shore line, repainted in horizontal marks whose colours are

     of the jetty posts and the boat. Built once; alive it is drawn in thin strips that shift sideways (it trembles) ---- */
  const lakeRect=()=>[-0.04*LW,(Hn-0.004)*LH,1.08*LW,(1.004-Hn)*LH+2];
  function paintLake(g,R,K){ const r=lakeRect(), y0=Hn*LH, s=g.getTransform().a, [sx,sy]=sunXY(), nr=noise(hash(K.seed,'ripple'));
    g.fillStyle='#35667A'; g.fillRect(r[0],r[1],r[2],r[3]);

    const at=(x,y)=>{ const px=clamp(Math.round((x-r[0])*s),0,w-1), py=clamp(Math.round((y-r[1])*s),0,h-1), k=(py*w+px)*4; return [id[k],id[k+1],id[k+2]]; };
    let y=y0+1;
    while(y<LH+4){ const p=persp(y), dy=3.2*p; let x=r[0]-R.r(0,40);

        x+=len*R.r(0.45,0.8); }
      y+=dy; }
    // ripple streaks: pale sky-coloured light lines and dark troughs, sparser and longer toward the viewer
    for(let i=0;i<2600;i++){ const yy=R.r(y0+4,LH), p=persp(yy), xx=R.r(r[0],r[0]+r[2]), light=R.f()<0.5;

    // the gold path: the sun's mirror broken into horizontal dashes, wider toward the viewer
    const my=2*y0-sy;
    for(let i=0;i<1600;i++){ const yy=R.r(y0+2,LH), sig=(0.012+0.06*Math.pow(depth(yy),0.8))*LW, xx=sx+R.g()*sig, p=persp(yy);
      const near=Math.exp(-Math.pow((yy-my)/(0.07*LH),2)), wgt=Math.exp(-Math.pow((xx-sx)/sig,2)/2);
      if(R.f()>0.35+0.65*near) continue;
      dab(g,xx,yy,R.r(10,40)*p,R.r(1.5,3.6)*p,R.r(-2,2)*DEG,R.pick(['#F7CF86','#FBDD9E','#F2BF74','#FFE8B8']),R,{imp:0.25,alpha:(0.45+0.5*wgt)*R.r(0.7,1),jit:[3,0.04,0.03],taper:[0.4,1,0.4]}); }
    // reflections of the jetty posts and the boat (they tremble with the water)
    for(const q of JET.posts){ const x=q[0], yb=q[1]+q[2], len=q[2]*1.3;
      for(let k=0;k<5;k++) dab(g,x+R.r(-3,3),yb+len*(k+0.5)/5,len/4,q[3]*R.r(0.8,1.2),90*DEG+R.r(-0.1,0.1),R.pick(['#1E2F33','#243638','#2A3A3A']),R,{imp:0,alpha:0.65}); }
    const B=BOAT; for(let k=0;k<26;k++){ const u=R.r(-0.45,0.45); dab(g,B.cx+u*B.len*Math.cos(B.ang),B.cy+u*B.len*Math.sin(B.ang)+B.wid*R.r(0.55,1.2),R.r(14,34),R.r(3,6),R.r(-3,3)*DEG,R.pick(['#4A2E24','#5A3628','#3E2A22']),R,{imp:0,alpha:R.r(0.35,0.65)}); } }
  /* alive: the lake in strips of 3-9 px (thinner at the shore), each shifted by a smooth noise of (y, t) growing toward
     the viewer; strips overlap by a device row so no seam opens; then the glitter sparkles on the gold path */
  function lakeLive(g,K,tau,life,t){ if(tau<=0) return; const c=K.L.lake, s=c.s, r=c.rect, nt=noise(hash(K.seed,'tremble')), y0=Hn*LH;
    let y=r[1];
    while(y<r[1]+r[3]){ const d=depth(y+2), hh=3+6*d, amp=(0.4+5.5*Math.pow(d,1.3))*life, dx=amp*(0.7*nt(y/(10+30*d),tau*0.55)+0.3*Math.sin(TAU*(tau/2.3+y/(40+80*d))));

      G.push({x:xx,y:yy,l:R.r(8,24)*p,w:R.r(1.4,3)*p,ph:R.r(0,100),per:R.r(0.7,1.5),col:css(C(R.pick(['#FFF0C8','#FFE4A6','#FFF6DA'])))}); }

  /* ---- the jetty (perspective deck from the bottom-right corner) and the moored boat ---- */
  const JET=(()=>{ const far=[[0.668,0.655],[0.712,0.655]], near=[[0.80,1.03],[1.06,1.03]], posts=[];
    const L=u=>[lerp(far[0][0],near[0][0],u)*LW,lerp(far[0][1],near[0][1],u)*LH], Rr=u=>[lerp(far[1][0],near[1][0],u)*LW,lerp(far[1][1],near[1][1],u)*LH];

  const boatFlow=(tau,life)=>{ const th=life*0.6*DEG*Math.sin(TAU*tau/3.1+0.7), dy=life*2*Math.sin(TAU*tau/3.1), c=Math.cos(th), s=Math.sin(th), bx=BOAT.cx, by=BOAT.cy;

  /* ---- reeds and sedge: a dense static mass (cached) and tall front reeds that sway (drawn every frame) ---- */

  /* ---- the birch: white bark with black lenticels, a dark fissured base, thin limbs, drooping golden-green foliage ---- */
  const BIRCH={ trunk:[[0.150,1.04],[0.154,0.92],[0.161,0.82],[0.170,0.72],[0.181,0.62],[0.193,0.52],[0.204,0.42],[0.212,0.33],[0.219,0.24],[0.225,0.15],[0.23,0.08]],

           [[0.221,0.21],[0.245,0.13],[0.27,0.07]],[[0.188,0.55],[0.14,0.47],[0.09,0.42],[0.06,0.41]],[[0.225,0.14],[0.20,0.08],[0.18,0.04]]],

  function paintBirch(g,R,K){ const nzb=noise(hash(K.seed,'birch')), B=BIRCH;
    const Sm=limbSamples(smoothLine(toL(B.trunk),2),72,18,4,s=>0.05*nzb(s*9,1.3));
    fillLimb(g,Sm,'#E6E0D2');
    fillLimb(g,Sm,'#B9B1A2',0.38,-0.3);                      // the shadow side (left: the sun is to the right)
    for(const p of Sm){ // lenticels: short dark horizontal dashes across the bark; the base dark and fissured
      const base=clamp((p.y/LH-0.80)/0.2);
      if(R.f()<0.55+0.4*base){ const o=R.r(-0.45,0.45)*p.w, x=p.x+p.nx*o, y=p.y+p.ny*o;

  const leafRamp=ramp([[0,'#3A441A'],[0.2,'#56622A'],[0.4,'#76803A'],[0.58,'#9DA146'],[0.75,'#C2AF58'],[0.9,'#D8C572'],[1,'#EBDB96']]);
  function buildTufts(K){ const R=rng(hash(K.seed,'tufts',PAINT_V)), s=K.W/LW*OVER, B=BIRCH, [sx,sy]=sunXY(), nzt=noise(hash(K.seed,'tuftlit')), out=[];
    const limbPts=[]; for(const l of B.limbs.concat([B.trunk.slice(6)])) for(const p of resample(smoothLine(toL(l),1),10)) limbPts.push(p);
    for(const cl of B.clumps){ const cx=cl.c[0]*LW, cy=cl.c[1]*LH, rx=cl.r[0]*LW, ry=cl.r[1]*LH;
      for(let i=0;i<cl.n;i++){ const a=R.r(0,TAU), rr=Math.pow(R.f(),0.6), bx=cx+Math.cos(a)*rx*rr, by=cy+Math.sin(a)*ry*rr*0.9-ry*0.1;

    out.sort((a,b)=>a.lit-b.lit); return out; }
  /* the crown on the gust the reeds feel 0.25 s earlier: each spray swings about its root (a pendulum), outer sprays more */
  function drawTufts(g,K,tau,life,t){ const nj=noise(hash(K.seed,'tuftj'));
    for(const tf of K.tufts){ const sc=tf.sc;
      if(life<=0){ g.drawImage(tf.c,tf.x,tf.y,tf.c.width/sc,tf.c.height/sc); continue; }
      const w=gust(t-0.25-(LW-tf.rx)/700,K.seed), th=life*tf.m*(-0.07*w+0.035*nj(t/0.6,tf.ph)), dx=life*tf.m*(4*w+1.5*nj(t/0.4,tf.ph+7));

  /* ---- birds: a pair crossing the sky from the `birds` cue (two-stroke painterly V marks, flapping with glides) ---- */
  function drawBirds(g,K,tau,life,t){ const f=t*FPS, f0=cue('birds'), dur=150; if(f<f0||f>f0+dur) return;
    for(const [k,ox,oy,ph] of [[0,0,0,0],[1,-70,26,1.7]]){ const u=(f-f0)/dur, x=lerp(-0.06,1.06,u)*LW+ox, y=(0.155-0.03*u+0.006*Math.sin(TAU*u*1.3+k))*LH+oy;

  /* the drawing: slightly stronger pencil in the land and the foreground, lighter in the sky */
  S.pencil={ v:1, blur:2, gain:(x,y)=>{ const ny=y/LH; if(ny<0.30) return 1.28; if(ny<Hn+0.01) return 1.25; return inReeds(x,y)?1.3:1.08; } };
  S.reveal={ v:1, sketch:{top:[3.5,0.06,0.05,0.05,0.3], lo:[8.5,6.5,100,0.04,3.5]} };
  S.curves=()=>({});
  const hiDrift=tau=>[3.2*tau,0], loDrift=tau=>[2.0*tau,0];
  S.layers=[
    {name:'sky',    rect:()=>[0,0,LW,0.5*LH], paint:paintSky, parts:[{rect:()=>[-0.08*LW,0,1.16*LW,0.24*LH],drift:hiDrift},{rect:()=>[-0.1*LW,0.22*LH,1.2*LW,0.08*LH],drift:loDrift}]},
    {name:'sun',    rect:()=>[S.sun[0]*LW-120,S.sun[1]*LH-120,240,240], paint:paintSun},
    {name:'birds',  live:drawBirds},
    {name:'ridges', rect:()=>[-0.02*LW,0.17*LH,1.04*LW,0.32*LH], paint:paintRidges},
    {name:'mist',   rect:()=>[-0.12*LW,0.40*LH,1.26*LW,0.12*LH], paint:paintMist, drift:tau=>[3*tau,0], alpha:(tau,life)=>1-0.25*life*(0.5-0.5*Math.cos(TAU*tau/7))},
    {name:'lake',   rect:lakeRect, paint:paintLake, alpha:tau=>tau>0?0:1, live:lakeLive},
    {name:'boat',   rect:()=>[BOAT.cx-0.09*LW,BOAT.cy-60,0.18*LW,130], paint:paintBoat, flow:boatFlow},
    {name:'jetty',  rect:()=>[0.64*LW,0.63*LH,0.40*LW,0.40*LH], paint:paintJetty},
    {name:'fore',   rect:()=>[-0.02*LW,0.62*LH,1.04*LW,0.40*LH], paint:paintFore},
    {name:'birch',  rect:()=>[0,0,0.48*LW,LH], paint:paintBirch},
    {name:'reeds',  live:drawReeds},
    {name:'tufts',  live:drawTufts},
  ];
  return S;
})();
/* ===== end scene ===== */

/* =====================================================================
   ENGINE
   ===================================================================== */
const PLATES=[];
/* plate(name, {len, cutIn, cutOut}, fn). len in frames, keep it a multiple of BEAT.
   fn(S,R): S.t 0..1 progress, S.i local frame, S.f global frame, S.len, S.g context (logical coords),
   S.b generator re-seeded every 3 frames, S.nz generator per frame, R generator stable for the whole plate. */
function plate(name,opts,fn){ if(PLATES.some(p=>p.name===name)) console.warn(`duplicate plate name: ${name}`); PLATES.push(Object.assign({name,fn},opts)); }
function TOTAL(){ return PLATES.reduce((a,p)=>a+p.len,0); }
function locate(n){ let acc=0; for(let i=0;i<PLATES.length;i++){ if(n<acc+PLATES[i].len) return {idx:i,local:n-acc}; acc+=PLATES[i].len; } const i=PLATES.length-1; return {idx:i,local:PLATES[i].len-1}; }
/* at(name, x): the global frame of beat x of plate `name`, rounded to a whole frame. Call it while drawing. */
function at(name,x=0){ let acc=0; for(const p of PLATES){ if(p.name===name) return Math.round(acc+x*BEAT); acc+=p.len; } throw new Error(`at(): no plate named ${name}`); }
/* cue(name): the frame of a moment in CUES, the table the picture and the sound share */
function cue(name){ const c=CUES.find(c=>c[2]===name); if(!c) throw new Error(`cue(): no cue named ${name}`); return at(c[0],c[1]); }

/* transition at plate edges: a painting film is one shot, every plate has cutIn:false and cutOut:false */
function cut(g,S,amt){ g.save(); g.setTransform(1,0,0,1,0,0); g.fillStyle=`rgba(0,0,0,${amt})`; g.fillRect(0,0,g.canvas.width,g.canvas.height); g.restore(); }

function renderFrame(n,width,seed,target){
  n=((n%TOTAL())+TOTAL())%TOTAL();
  const W=Math.round(width); let H=Math.round(W/AR); if(H%2) H++;   // even height for libx264
  const cv=cvs('content',W,H), g=wipe(cv.getContext('2d')), sc=W/LW;
  const {idx,local}=locate(n), P=PLATES[idx];
  const S={ f:n, i:local, t:local/P.len, len:P.len, g, cv, sc, seed, W:LW, H:LH, name:P.name, post:{},
            b:rng(hash(seed,'b',P.name,Math.floor(n/3))), nz:rng(hash(seed,'nz',n)) };
  const R=rng(hash(seed,'plate',P.name));
  g.fillStyle=COL.bg; g.fillRect(0,0,W,H);
  g.setTransform(sc,0,0,sc,0,0); g.imageSmoothingEnabled=true;
  P.fn(S,R);
  const edgeIn=local, edgeOut=P.len-1-local;
  if(P.cutIn!==false && edgeIn<3) cut(g,S,1-edgeIn/3);
  else if(P.cutOut!==false && edgeOut<2) cut(g,S,1-edgeOut/2);
  g.setTransform(1,0,0,1,0,0);
  if(target.width!==W||target.height!==H){ target.width=W; target.height=H; }
  post(cv,target,S,S.post);
  return S;
}

function contactSheet(n,cellW,seed,target,f0=0,f1=TOTAL()-1){
  const cols=AR>=1?6:8, rows=Math.ceil(n/cols), cellH=Math.round(cellW/AR), lab=26, gap=8;
  const SW=cols*(cellW+gap)+gap, SH=rows*(cellH+lab+gap)+gap;
  target.width=SW; target.height=SH; const g=target.getContext('2d');
  g.fillStyle='#181818'; g.fillRect(0,0,SW,SH);
  const tmp=cvs('cell',cellW*2,Math.round(cellW*2/AR));
  for(let i=0;i<n;i++){
    const f=n>1?Math.round(f0+i*(f1-f0)/(n-1)):f0;
    const S=renderFrame(f,cellW*2,seed,tmp);
    const x=gap+(i%cols)*(cellW+gap), y=gap+Math.floor(i/cols)*(cellH+lab+gap);
    g.drawImage(tmp,x,y,cellW,cellH);
    g.fillStyle='#ddd'; g.font='12px Menlo, monospace'; g.textBaseline='top';
    g.fillText(`f=${f}  ${S.name}  t=${S.t.toFixed(2)}  ${(f/FPS).toFixed(1)}s`,x+2,y+cellH+6);
  }
}

/* =====================================================================
   PLATES. One shot in three chapters of time; every plate draws the same painting.
   ===================================================================== */

/* moments the picture and the sound share: [plate, beat, name], beats counted from the plate's start */
const CUES=[
  ['sketch',0.4,'marks'],       // f6   first pencil islands along the top edge
  ['colour',0,'wash'],          // f60  colour blooms start (bottom first)
  ['colour',13/15,'finish'],    // f73  global finish 0.65 -> 1 starts
  ['colour',27/15,'step'],      // f87  the one-frame +0.1 step
  ['colour',38/15,'done'],      // f98  paint complete
  ['alive',0,'alive'],          // f105 life ramps in
  ['alive',1/3,'push'],         // f110 camera push-in starts
  ['alive',95/15,'birds'],      // f200 the bird pair enters from the left
];

plate('sketch',{len:4*BEAT, cutIn:false, cutOut:false},(S)=>drawPainting(S));
plate('colour',{len:3*BEAT, cutIn:false, cutOut:false},(S)=>drawPainting(S));
plate('alive', {len:23*BEAT, cutIn:false, cutOut:false},(S)=>drawPainting(S));

/* =====================================================================
   BOOT
   ===================================================================== */
const MAIN=document.getElementById('c'); MAIN.getContext('2d',{willReadFrequently:true});
window.RISO={
  fps:FPS,
  get total(){ return TOTAL(); },
  get plates(){ return PLATES.map(p=>({name:p.name,len:p.len})); },
  frame(n,width,seed){ renderFrame(n,width??WIDTH,seed??SEED,MAIN); return MAIN.toDataURL('image/png'); },
  contact(n,cellW,f0,f1){ contactSheet(n||24,cellW||480,SEED,MAIN,f0??0,f1??TOTAL()-1); return MAIN.toDataURL('image/png'); },
  curves(seed){ const start={}; let acc=0; for(const p of PLATES){ start[p.name]=acc; acc+=p.len; }
    return {fps:FPS,bpm:BPM,total:acc,start,frames:paintingCurves(seed??SEED),cues:CUES.map(([plate,beat,name])=>{ if(!PLATES.some(p=>p.name===plate)) throw new Error(`CUES row ${name}: no plate named ${plate}`);
      return {name,plate,beat,f:at(plate,beat)}; })}; }
};
window.addEventListener('load',()=>{
  if(Q.has('grid')){ contactSheet(+Q.get('grid')||24,+Q.get('cw')||480,SEED,MAIN,+(Q.get('from')||0),Q.has('to')?+Q.get('to'):TOTAL()-1); window.__ready=true; }
  else if(Q.has('f')){ renderFrame(+Q.get('f')||0,WIDTH,SEED,MAIN); window.__ready=true; }
  else { let f=+(Q.get('from')||0), last=0;
    const tick=(ts)=>{ if(ts-last>=1000/FPS){ last=ts; renderFrame(f++,Math.min(WIDTH,960),SEED,MAIN); } requestAnimationFrame(tick); };
    requestAnimationFrame(tick); window.__ready=true; }
});
</script>
</body>
