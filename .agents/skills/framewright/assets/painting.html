<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>framewright painting</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;margin:0 auto;max-width:100vw;max-height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =====================================================================
   framewright painting film. One file, one canvas. A frame is a pure function of
   (frame number, seed, width). No images, no video, no base64, no CDN.
   A painting film is one picture told in three media without a cut: a pencil drawing appears on blank paper,
   oil colour washes in over it and finishes, then the painting comes alive and the camera pushes in. The drawing
   is computed from the painting, so the eye watches the medium change, not the composition. Method, recipes,
   costs and review: references/painting.md. The demo scene is a lake at dawn, 12 s.
   URL knobs:  ?f=140  ?s=12  ?w=1920  ?grid=24  ?cw=480  ?from=60&to=180  ?ar=16:9
   Without knobs the page plays a live preview (capped at 960 px wide).
   Layout of this file: params -> generators -> math -> helpers -> painting kit -> scene -> engine -> plates -> boot.
   Write your picture in the scene block (SCENE); the painting kit stays as it is. Every plate calls drawPainting(S).
   Keep every helper ABOVE the plates block. Never put helpers between plates.
   ===================================================================== */

/* ---------- parameters ---------- */
const Q = new URLSearchParams(location.search);
const FPS = 30, BPM = 120;
const BEAT = Math.round(FPS * 60 / BPM), BAR = BEAT * 4;   // 120 BPM -> beat 15 frames, bar 60
const SHORT = 1080;                                        // logical short side, all geometry lives here
function parseAR(s){ const m=/^(\d+(?:\.\d+)?)[:x\/](\d+(?:\.\d+)?)$/.exec(s||''); return m ? (+m[1])/(+m[2]) : 16/9; }
const AR = parseAR(Q.get('ar') || '16:9');
const LW = AR >= 1 ? Math.round(SHORT*AR) : SHORT;         // logical width
const LH = AR >= 1 ? SHORT : Math.round(SHORT/AR);         // logical height
const CX = LW/2, CY = LH/2;
const SEED  = +(Q.get('s') || 7);
const WIDTH = +(Q.get('w') || 1920);
const SAFE  = 0.08;                                        // keep important content this far from edges (fraction of LH)
const TITLE_Y = AR < 1 ? 0.70 : 0.80;                      // baseline of lower titles; in 9:16 the bottom 20 % belongs to platform UI

/* ---------- generators ---------- */
function hash(){ // any arguments -> 32-bit seed
  let h = 2166136261 >>> 0;
  for (let k=0;k<arguments.length;k++){ const s=String(arguments[k])+'|';
    for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } }
  h ^= h>>>13; h = Math.imul(h, 0x5bd1e995); h ^= h>>>15;
  return h >>> 0;
}
function rng(seed){ // sfc32
  let a=seed>>>0, b=0x9e3779b9, c=0x6a09e667, d=0xbb67ae85;
  const f=()=>{ a>>>=0;b>>>=0;c>>>=0;d>>>=0; let t=(a+b)|0; a=b^(b>>>9); b=(c+(c<<3))|0; c=(c<<21)|(c>>>11); d=(d+1)|0; t=(t+d)|0; c=(c+t)|0; return (t>>>0)/4294967296; };
  for(let i=0;i<12;i++) f();
  return {
    f, r:(lo,hi)=>lo+(hi-lo)*f(), i:(n)=>Math.floor(f()*n), pick:(arr)=>arr[Math.floor(f()*arr.length)],
    sign:()=>f()<0.5?-1:1, chance:(p)=>f()<p,
    g:()=>{ let u=0,v=0; while(u===0)u=f(); while(v===0)v=f(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
  };
}

/* ---------- math ---------- */
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const span=(f,a,b)=>clamp((f-a)/(b-a));                    // progress of f between a and b, 0..1
const smooth=t=>{t=clamp(t);return t*t*(3-2*t)};
const sstep=(a,b,x)=>smooth((x-a)/(b-a));                  // smoothstep from a to b (a > b runs downhill)
const ease=Object.freeze({                                 // frozen, like COL: a plate that edits shared values breaks render order
  out:t=>1-Math.pow(1-clamp(t),3), in:t=>Math.pow(clamp(t),3),
  io:t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2},
  back:t=>{const c=1.70158;t=clamp(t);return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)},
  elastic:t=>{t=clamp(t);return t===0||t===1?t:Math.pow(2,-10*t)*Math.sin((t*10-0.75)*(2*Math.PI/3))+1}
});
const pad=(n,w=2)=>String(n).padStart(w,'0');
const TAU=Math.PI*2, DEG=Math.PI/180;

/* ---------- canvas pool ---------- */
const POOL={};
function cvs(name,w,h){ let c=POOL[name]; if(!c){ c=document.createElement('canvas'); c.getContext('2d',{willReadFrequently:true}); POOL[name]=c; } if(c.width!==w||c.height!==h){ c.width=w; c.height=h; } return c; }
/* a pooled canvas keeps its context from frame to frame: wipe it before drawing, or a save() without restore(), a clip,
   a shadow or a composite mode left by one frame leaks into the next and frames start to depend on render order */
function wipe(g){ if(g.reset) g.reset(); else g.canvas.width=g.canvas.width; return g; }

/* ---------- palette (a painting film: the paper and the pencil; the painting's colours live in the scene) ---------- */
const COL=Object.freeze({ bg:'#F2EBDC', paper:'#F2EBDC', ink:'#30281D' });
const FONT_MONO='Menlo, Monaco, "Courier New", monospace';
const FONT_SANS='"Helvetica Neue", Helvetica, Arial, sans-serif';

/* =====================================================================
   HELPERS (all above the plates block)
   ===================================================================== */

/* ---- pixel text: system font -> threshold -> nearest-neighbour upscale. Gives bitmap/teletext/OSD look.
   o: x,y, px (font size in glyph pixels, 14 is good), cell (logical units per glyph pixel),
      align left|center|right, base top|middle|bottom, color, bg, pad, reveal 0..1, fit (max width), alpha ---- */
const GLYPH={};
function glyphs(str,o){
  const px=o.px||14, font=`${o.weight||'bold'} ${px}px ${o.font||FONT_MONO}`, thr=(o.thr||0.5)*255;
  const key=str+'~#~'+font+'~#~'+thr;
  if(GLYPH[key]) return GLYPH[key];
  const m=document.createElement('canvas'); let mg=m.getContext('2d'); mg.font=font;
  const tw=Math.ceil(mg.measureText(str).width)+6, th=Math.ceil(px*1.7)+6;
  m.width=tw; m.height=th; mg=m.getContext('2d'); mg.font=font; mg.fillStyle='#fff'; mg.textBaseline='alphabetic';
  mg.fillText(str,3,Math.round(px*1.2));
  const id=mg.getImageData(0,0,tw,th), d=id.data; let x0=tw,x1=-1,y0=th,y1=-1;
  for(let y=0;y<th;y++)for(let x=0;x<tw;x++){ const i=(y*tw+x)*4; const on=d[i+3]>thr; d[i]=d[i+1]=d[i+2]=255; d[i+3]=on?255:0;
    if(on){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  if(x1<0){x0=0;x1=0;y0=0;y1=0;}
  mg.putImageData(id,0,0);
  return GLYPH[key]={c:m,x0,y0,w:x1-x0+1,h:y1-y0+1};
}
function pixW(str,o){ return glyphs(str,o).w*(o.cell||6); }
function pixText(g,str,o){
  const G=glyphs(str,o); let cell=o.cell||6; if(o.fit) cell=Math.max(1,Math.min(cell,Math.floor(o.fit/G.w)));
  const w=G.w*cell, h=G.h*cell;
  let x=o.x, y=o.y;
  if(o.align==='center') x-=w/2; else if(o.align==='right') x-=w;
  if(o.base==='middle') y-=h/2; else if(o.base==='bottom') y-=h;
  x=Math.round(x/cell)*cell; y=Math.round(y/cell)*cell;      // snap to the glyph grid, otherwise letters shimmer
  if(o.bg){ const p=(o.pad??1)*cell; g.fillStyle=o.bg; g.fillRect(x-p,y-p,w+2*p,h+2*p); }
  const rev=o.reveal??1; if(rev<=0) return {x,y,w,h};
  const sw=Math.max(1,Math.round(G.w*rev));
  const t=cvs('tint',G.w,G.h), tg=t.getContext('2d');
  tg.clearRect(0,0,G.w,G.h); tg.drawImage(G.c,G.x0,G.y0,G.w,G.h,0,0,G.w,G.h);
  tg.globalCompositeOperation='source-in'; tg.fillStyle=o.color||COL.ink; tg.fillRect(0,0,G.w,G.h); tg.globalCompositeOperation='source-over';
  g.save(); g.imageSmoothingEnabled=false; if(o.alpha!=null) g.globalAlpha=o.alpha;
  g.drawImage(t,0,0,sw,G.h,x,y,sw*cell,h);
  g.restore();
  return {x,y,w,h};
}

/* ---- vector text with the same alignment API, for large display type ---- */
function vecText(g,str,o){
  g.save(); g.font=`${o.weight||'bold'} ${o.size||120}px ${o.font||FONT_SANS}`; g.fillStyle=o.color||COL.ink;
  g.textAlign=o.align||'left'; g.textBaseline=o.base||'alphabetic'; if(o.alpha!=null) g.globalAlpha=o.alpha;
  g.fillText(str,o.x,o.y); g.restore();
}

/* ---- deterministic per-pixel finisher. Grain and vignette only; put your style's post-processing here
   (halftone, scanlines, barrel, misregistration...). Runs on output pixels, ~50 ms per 1080p pass. ---- */
function post(src,dst,S,o={}){
  const W=src.width,H=src.height, sg=src.getContext('2d'), dg=wipe(dst.getContext('2d'));   // the target keeps nothing of the previous frame
  const grain=(o.grain??0)*(S.grain??1), vig=o.vig??0;
  if(!grain && !vig){ dg.drawImage(src,0,0); return; }
  const id=sg.getImageData(0,0,W,H), d=id.data, cx=(W-1)/2, cy=(H-1)/2;
  let z=hash(S.seed,'grain',S.f)|0;
  for(let y=0;y<H;y++){ const ny=(y-cy)/cy;
    for(let x=0;x<W;x++){ const i=(y*W+x)*4; const nx=(x-cx)/cx, r2=nx*nx+ny*ny;
      z=(Math.imul(z,1664525)+1013904223)|0; const gn=((z>>>24)/255-0.5)*grain; const v=1-vig*Math.pow(r2*0.5,1.4);
      d[i]=clamp(d[i]*v+gn,0,255); d[i+1]=clamp(d[i+1]*v+gn,0,255); d[i+2]=clamp(d[i+2]*v+gn,0,255); } }
  dg.putImageData(id,0,0);
}

/* ---- generated data goes between markers so scripts can replace it (see scripts/inject.mjs) ---- */
/*PORTRAIT_START*/
const PORTRAIT={"w":1,"h":1,"levels":[]};
/*PORTRAIT_END*/

/* ===== painting kit ===== */
/* A painting film shows one oil painting in three media without a cut: a pencil drawing computed from the painting
   appears on blank paper, the painting washes in over it and finishes, then the painting comes alive under a slow
   push-in. The painting is built once per (seed, width) from cached layers of brush marks; after that a frame is a few
   blits, two 1/4-resolution masks and the marks that move. Method, recipes, costs and review: references/painting.md.
   drawPainting(S) draws any frame of it; every plate calls it. This block knows nothing of the scene: regions,
   colours and builders live in the object SCENE (scene block below), which provides
     horizon        y of the horizon as a fraction of the height: depth() and persp() scale marks from it
     tRef           the film time (s) handed to live() while the still is composed (at rest: tau 0, life 0)
     layers         back to front: [{name, rect(), paint(g, R, K, parts), parts, drift, flow, alpha, clip, live}]
                      rect() -> [x, y, w, h] in logical px: the cache's extent (only with paint)
                      paint(g, R, K, parts): builds the cache once; R its generator, K the kit (K.L holds the layers
                        built before this one, K.seed, K.W), parts the contexts of its parts
                      parts [{rect(), drift(tau, life)}]: extra canvases painted in the same pass that move on their own
                      drift, flow, alpha: how the cached layer moves when alive (drawLayer)
                      clip: a polygon in logical px the layer is clipped to
                      live(g, K, tau, life, t): marks drawn every frame, and once at rest into the still
                    A layer without paint is live only.
     prepare(K)     runs before any layer is painted: lists of live marks, sprites, shared fields
   and optionally
     life {ramp}, camera {cue, rate, ease, focus}, wind {f, swell, hi, noise, am, pm}   override LIFE key by key
     pencil {v, blur, gain(x, y), o}      a per-region pencil gain (a 1/4-res field blurred by `blur` cells, cached
                                          under version v) and o, overrides of PENCIL
     reveal {v, blur, settle, sketch, colour, offset: {sketch(x, y), colour(x, y)}}   merged key by key into REVEAL
                                          (colour.finish too, so {colour: {finish: {kmax: 0.15}}} keeps the rest);
                                          offsets are frames added to a time field before its floor and ceiling, so
                                          parts of the picture arrive earlier or later
     curves(K, f, tau, life) -> {...}     extra per-frame fields for the sound
   Cues it reads: wash (colour starts), finish (the global finish starts), step (a one-frame step of the colour),
   done (paint complete: the still), alive (life ramps in) and the camera's cue (push). marks is the sound's: the
   REVEAL defaults put the first ink on the paper there. The REVEAL time fields are in absolute frames, tuned for
   marks f6, wash f60, finish f73, step f87, done f98, alive f105 (plates of 60 and 45 frames before the living one);
   a film that moves these cues moves t0, lo and hi of SCENE.reveal.sketch and .colour with them.
   Rules: geometry in logical units; randomness only from rng(hash(seed, name, ...)); every cache keyed by all its
   inputs and never a pooled canvas; caches built from fixed inputs only; getImageData only while building. */
const PAINT_V=1;                 // recipe version: part of every cache key and of every layer's seed (a new value repaints every mark)
const OVER=1.14;                 // caches are built this much larger than the output: a push-in up to x1.14 never upsamples

/* ---- colour: [r, g, b] arrays, 0..255 ---- */
const hexc=h=>{ const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; };
const C=c=>typeof c==='string'?hexc(c):c;
const mixc=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const css=(c,a=1)=>{ const r=clamp(c[0],0,255)|0, g=clamp(c[1],0,255)|0, b=clamp(c[2],0,255)|0;
  return a>=1?`rgb(${r},${g},${b})`:`rgba(${r},${g},${b},${Math.round(clamp(a)*1000)/1000})`; };
function rgb2hsl(c){ const r=c[0]/255,g=c[1]/255,b=c[2]/255, mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2; let h=0,s=0;
  if(mx!==mn){ const d=mx-mn; s=l>0.5?d/(2-mx-mn):d/(mx+mn); h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4; h*=60; } return [h,s,l]; }
function hsl2rgb(h,s,l){ h=((h%360)+360)%360; const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2; let r,g,b;
  if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;} else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
  return [(r+m)*255,(g+m)*255,(b+m)*255]; }
const hsl=(c,dh=0,ds=0,dl=0)=>{ const q=rgb2hsl(C(c)); return hsl2rgb(q[0]+dh,clamp(q[1]+ds),clamp(q[2]+dl)); };
const JIT=[4,0.06,0.05];                                   // per-dab jitter: hue deg, saturation, lightness
const jit=(c,R,j=JIT)=>hsl(c,R.r(-j[0],j[0]),R.r(-j[1],j[1]),R.r(-j[2],j[2]));
/* a colour ramp through [v, colour] stops */
function ramp(st){ const S=st.map(([v,c])=>[v,C(c)]);
  return v=>{ if(v<=S[0][0]) return S[0][1]; for(let i=1;i<S.length;i++) if(v<=S[i][0]){ const a=S[i-1], b=S[i]; return mixc(a[1],b[1],(v-a[0])/(b[0]-a[0])); } return S[S.length-1][1]; }; }
/* pick from a palette by a noise value v in about -1..1 (clusters of the same colour where v is smooth) */
const pickPal=(pal,v)=>pal[clamp(Math.floor((v*0.5+0.5)*pal.length),0,pal.length-1)];

/* ---- value noise on a seeded 256x256 lattice table (a hash per lookup is 50x slower); range about -1..1 ---- */
const NOISE=new Map();
function noise(seed){ let n=NOISE.get(seed); if(n) return n;
  const R=rng(seed), T=new Float32Array(65536); for(let i=0;i<65536;i++) T[i]=R.f()*2-1;
  n=(x,y)=>{ const xf=Math.floor(x), yf=Math.floor(y), fx=x-xf, fy=y-yf, u=fx*fx*(3-2*fx), v=fy*fy*(3-2*fy);
    const x0=xf&255, x1=(xf+1)&255, y0=(yf&255)<<8, y1=((yf+1)&255)<<8, a=T[y0|x0], b=T[y0|x1], c=T[y1|x0], d=T[y1|x1];
    return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; };
  n.fbm=(x,y,o=3)=>{ let s=0,a=1,t=0; for(let k=0;k<o;k++){ s+=a*n(x,y); t+=a; a*=0.5; x=x*2.03+17.1; y=y*2.03+31.7; } return s/t; };
  NOISE.set(seed,n); return n; }

/* ---- geometry: polygons and polylines in logical units ---- */
const toL=pts=>pts.map(p=>[p[0]*LW,p[1]*LH]);
function inPoly(P,x,y){ let o=false; for(let i=0,j=P.length-1;i<P.length;j=i++){ const xi=P[i][0], yi=P[i][1], xj=P[j][0], yj=P[j][1];
  if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi)) o=!o; } return o; }
function segDist(px,py,ax,ay,bx,by){ const vx=bx-ax, vy=by-ay, u=clamp(((px-ax)*vx+(py-ay)*vy)/((vx*vx+vy*vy)||1)); return Math.hypot(px-ax-u*vx,py-ay-u*vy); }
function lineDist(L,x,y,closed=false){ let d=1e9; const n=L.length, m=closed?n:n-1;
  for(let i=0;i<m;i++){ const a=L[i], b=L[(i+1)%n], e=segDist(x,y,a[0],a[1],b[0],b[1]); if(e<d) d=e; } return d; }
const sdPoly=(P,x,y)=>inPoly(P,x,y)?-lineDist(P,x,y,true):lineDist(P,x,y,true);
function bbox(P){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const p of P){ if(p[0]<x0)x0=p[0]; if(p[1]<y0)y0=p[1]; if(p[0]>x1)x1=p[0]; if(p[1]>y1)y1=p[1]; } return {x0,y0,x1,y1}; }
/* y of a polyline sorted by x, at x (held flat past the ends); and its direction there in radians */
function yOn(L,x){ if(x<=L[0][0]) return L[0][1]; for(let i=1;i<L.length;i++) if(x<=L[i][0]){ const a=L[i-1], b=L[i]; return lerp(a[1],b[1],(x-a[0])/((b[0]-a[0])||1)); } return L[L.length-1][1]; }
function angOn(L,x){ let i=1; while(i<L.length-1&&x>L[i][0]) i++; const a=L[i-1], b=L[i]; return Math.atan2(b[1]-a[1],b[0]-a[0]); }
/* Chaikin corner cutting: a smooth polyline through a few hand-placed points (ends kept) */
function smoothLine(L,it=2){ let P=L; for(let k=0;k<it;k++){ const Q=[P[0]]; for(let i=0;i<P.length-1;i++){ const a=P[i], b=P[i+1];
  Q.push([a[0]*0.75+b[0]*0.25,a[1]*0.75+b[1]*0.25],[a[0]*0.25+b[0]*0.75,a[1]*0.25+b[1]*0.75]); } Q.push(P[P.length-1]); P=Q; } return P; }
function pathPoly(g,P,close=true){ g.beginPath(); g.moveTo(P[0][0],P[0][1]); for(let i=1;i<P.length;i++) g.lineTo(P[i][0],P[i][1]); if(close) g.closePath(); }
/* resample a polyline by arc length: [{x, y, tx, ty (unit tangent), s (0..1)}] */
function resample(L,step){ const d=[0]; for(let i=1;i<L.length;i++) d.push(d[i-1]+Math.hypot(L[i][0]-L[i-1][0],L[i][1]-L[i-1][1]));
  const tot=d[d.length-1], n=Math.max(2,Math.ceil(tot/step)), out=[]; let j=1;
  for(let k=0;k<=n;k++){ const s=k/n*tot; while(j<L.length-1&&d[j]<s) j++; const a=L[j-1], b=L[j], u=(s-d[j-1])/((d[j]-d[j-1])||1), l=Math.hypot(b[0]-a[0],b[1]-a[1])||1;
    out.push({x:lerp(a[0],b[0],u),y:lerp(a[1],b[1],u),tx:(b[0]-a[0])/l,ty:(b[1]-a[1])/l,s:k/n}); }
  return out; }
const depth=y=>clamp((y/LH-SCENE.horizon)/(1-SCENE.horizon));   // 0 at the horizon, 1 at the bottom edge
const persp=y=>0.4+0.8*depth(y);                                 // mark size (and later speed) factor with distance

/* ---- cached layers: built once on their own canvas, never drawn into again, keyed by every input ----
   parts (optional): rects of extra canvases built in the same pass with the same generator, so a layer's marks can be split
   into pieces that move differently later (the sky's cloud marks drift, its base does not) and the still stays identical;
   build receives their contexts as its 4th argument, and the canvas carries them as c.parts */
const LAYERS=new Map();                                          // separate from POOL: pooled canvases are rewritten every frame
function layer(name,deps,rect,build,parts=null){
  const key=name+'|'+JSON.stringify(deps)+'|'+rect.map(v=>Math.round(v)).join(',')+(parts?'|'+parts.map(r=>r.map(v=>Math.round(v)).join(',')).join(';'):'');
  let c=LAYERS.get(key); if(c) return c;
  const s=deps.W/LW*deps.over, mk=r=>{ const k=document.createElement('canvas'); k.width=Math.max(1,Math.ceil(r[2]*s)); k.height=Math.max(1,Math.ceil(r[3]*s));
    const g=k.getContext('2d',{willReadFrequently:true}); g.setTransform(s,0,0,s,-r[0]*s,-r[1]*s); g.lineCap='round'; g.lineJoin='round'; k.rect=r; k.s=s; return [k,g]; };
  const [c0,g]=mk(rect), P=parts?parts.map(mk):null; c=c0;

/* the settling glaze: while the colour finishes (finish -> step) the painting is pulled toward grey by REVEAL.settle

  tg.setTransform(g.getTransform()); tg.imageSmoothingEnabled=true; blit(tg,src); desat(tg,d);   // g's transform: the camera

/* the colour finish: blooms stop at cap[0], the base cap rises by cap[1] from `finish` to the frame before `done` and
   steps by cap[2] at `step`; per pixel the cap creeps with age (`creep` per frame, at most `kmax`), so early blooms
   are fuller than late ones before the step, under a ceiling ceil[0] that opens to 1 over ceil[4] frames from
   clamp(step + ceil[1] + ceil[3] * (T - wash - 10), step + ceil[1], done + ceil[2]): early pixels finish first */
function finishOf(f,fo){ const c=fo.cap, ce=fo.ceil;
  return { cap:Math.min(1,c[0]+c[1]*span(f,cue('finish'),cue('done')-1)+c[2]*(f>=cue('step'))),
    fin:{creep:fo.creep, kmax:fo.kmax, m0:ce[0], m1:cue('step')+ce[1], m2:cue('done')+ce[2], ms:ce[3], mw:ce[4], piv:cue('wash')+10} }; }
/* the reveal time fields and their options (no pixels: the sound's curves read them too) */
function revealFields(seed){ const SR=SCENE.reveal||{}, OF=SR.offset||{};
  const SC=SR.colour||{}, RV={ settle:SR.settle??REVEAL.settle, sketch:Object.assign({},REVEAL.sketch,SR.sketch||{}),
    colour:Object.assign({},REVEAL.colour,SC,{finish:Object.assign({},REVEAL.colour.finish,SC.finish||{})}) };   // colour.finish merges key by key too
  for(const k of ['sketch','colour']) if(OF[k]){ const key='revealOff_'+k+'|'+(SR.v||0);   // scene offsets in frames, softened by `blur` cells
    RV[k].off=field('revealOff_'+k,{ar:+AR.toFixed(5),v:SR.v||0},F=>{ for(let j=0;j<F.gh;j++) for(let i=0;i<F.gw;i++) F.a[j*F.gw+i]=OF[k](i*FCELL,j*FCELL); if(SR.blur) blurField(F,SR.blur); }); RV[k].offKey=key; }

/* the kit's reveal caches, built on first use (a frame after `done` never builds them) */
function reveals(K){ if(K.R) return K.R; const G=SCENE.pencil||{}, RF=revealFields(K.seed);
  const gain=G.gain?field('pencilGain',{seed:K.seed,ar:+AR.toFixed(5),v:G.v||0},F=>{ for(let j=0;j<F.gh;j++) for(let i=0;i<F.gw;i++) F.a[j*F.gw+i]=G.gain(i*FCELL,j*FCELL); if(G.blur) blurField(F,G.blur); }):null;

/* per-frame curves for the sound (RISO.curves().frames): sketch and colour = the revealed share of the drawing and of the
   paint (the mean of their masks), life = L, gust = the wind w(t) (what sways moves by L * w), z = the camera zoom, plus
   the scene's own fields from SCENE.curves(K, f, tau, life) (a foam share, a count of births). Evaluated from the time fields and the life clock (the scene's curves may read the kit built at 320 px). */
function paintingCurves(seed){ const RF=revealFields(seed), sk=RF.RV.sketch, co=RF.RV.colour, K=kit(seed,320), out=[];
  const share=(F,f,o)=>{ const a=F.a, hw=o.hw; let s=0; for(let k=0;k<a.length;k+=7){ const u=(f-a[k]+hw)/(2*hw); s+=u<=0?0:u>=1?1:u*u*(3-2*u); } return s/Math.ceil(a.length/7); };

    const r={ f, sketch:+(f>=cue('wash')?1:share(RF.Ts,f,sk)).toFixed(4), colour:+(f<cue('wash')?0:f>=cue('done')?1:share(RF.Tc,f,co)*fo.cap).toFixed(4),

/* one frame of the painting film: every plate calls this. Paper -> the drawing uncovered by Ts -> the painting over the
   whole drawing through Tc and the two-stage cap -> from `done` the still, settling and fading into its living layers at
   rest until `alive` -> from `alive` the living painting (life clock, amplitude, wind), all under the camera. */

   paper; the living frames' cross-fade must hide what lies under them too). Built from the still, cached */
function stillOnPaper(K){ return layer('stillPaper',K.deps,[0,0,LW,LH],g=>{ g.fillStyle=COL.bg; g.fillRect(0,0,LW,LH); blit(g,K.still); }); }
function drawPainting(S){

  if(f>=cue('done')){ composeLive(g,K,lifeClock(f),L,f/FPS);
    const a=cue('done'), b=cue('alive'), xf=f<b?1-(f-a)/(b-a):0; if(xf>0){ g.globalAlpha=xf; blit(g,stillOnPaper(K)); g.globalAlpha=1; }   // done -> alive: the still fades into its living layers at rest (no step when life starts)

  if(f<cue('wash')){ drawField(g,Rv.paper); through(g,Rv.sketch,maskAt(0,Rv.Ts,f,sk),0); }

}
/* ===== end painting kit ===== */

/* ===== scene ===== */
/* The demo: a mountain lake at dawn. Replace this block with your picture; the painting kit above stays as it is.
   The sun over two ridges in aerial perspective, a cloud band that drifts, a calm lake that mirrors all of it and
   trembles when alive, glitter on the sun's path that fades in and out, a band of reeds in front that sways on the
   page's wind. Coordinates are fractions of the 16:9 frame (x, y from the top left), turned into logical px by toL().
   Layers back to front: sky (the sun in its base, the cloud band a part that drifts), ridges, lake (a painted mirror,
   drawn in trembling strips once alive, plus glitter), bank (the cached back reeds), reeds (front blades, every frame). */
const SCENE=(()=>{
  const S={ horizon:0.56, tRef:0, camera:{focus:[0.60,0.46]} };   // the push-in closes on the sun and its path
  const Hn=S.horizon, SUN=[0.60*LW,0.33*LH], SUN_R=30;
  const FAR=[[-0.02,0.40],[0.05,0.36],[0.11,0.315],[0.17,0.29],[0.22,0.305],[0.29,0.35],[0.37,0.395],[0.45,0.43],[0.53,0.455],
             [0.60,0.465],[0.67,0.45],[0.74,0.41],[0.80,0.36],[0.86,0.325],[0.91,0.335],[0.97,0.365],[1.02,0.39]];
  const NEAR_L=[[-0.02,0.445],[0.05,0.435],[0.12,0.45],[0.20,0.475],[0.28,0.505],[0.36,0.53],[0.43,0.55],[0.48,0.562]];
  const NEAR_R=[[0.70,0.562],[0.76,0.545],[0.83,0.515],[0.90,0.495],[0.96,0.49],[1.02,0.495]];
  const under=(L,y1=Hn+0.004)=>{ const P=toL(L); return P.concat([[P[P.length-1][0],y1*LH],[P[0][0],y1*LH]]); };
  const reedTop=x=>(0.90-0.07*Math.pow(Math.min(1,Math.abs(x/LW-0.5)*2),1.5))*LH;   // the reed band: higher at the sides

  /* ---- sky: pale lilac-blue above, rose and peach toward the horizon, a warm glow around the sun ---- */
  const skyRamp=ramp([[0,'#A7B2CE'],[0.3,'#C4B6CB'],[0.55,'#E4AFA4'],[0.75,'#F0BA9F'],[0.9,'#F5CDAE'],[1,'#F7DCBC']]);
  function skyCol(x,y){ const c=skyRamp(clamp(y/(Hn*LH))), r=Math.hypot((x-SUN[0])/LW,(y-SUN[1])/LH*0.9);
    return mixc(mixc(c,C('#FBE3B8'),0.75*Math.exp(-r*r/0.012)),C('#FFF3D6'),0.8*Math.exp(-r*r/0.0012)); }
  function paintSky(g,R,K,P){
    fieldFill(g,[-0.04*LW,0,1.08*LW,(Hn+0.01)*LH],skyCol,10);                         // a smooth base coat under the marks
    paintRegion(g,R,{name:'sky',P:toL([[-0.05,-0.02],[1.05,-0.02],[1.05,Hn+0.01],[-0.05,Hn+0.01]]),len:[26,64],wid:[9,17],flow:0,angJit:9,cover:1.5,
      imp:0.3,ridgeP:0.35,br:0.5,brP:0.4,rag:0.3,cluster:80,jit:[3,0.04,0.03],col:(x,y,v)=>hsl(skyCol(x,y),0,0,0.02*v)},K.seed);
    const gr=g.createRadialGradient(SUN[0],SUN[1],0,SUN[0],SUN[1],SUN_R*4.2);        // the sun: a glow, a disc of pale dabs, a warm rim
    gr.addColorStop(0,'rgba(255,250,228,1)'); gr.addColorStop(0.25,'rgba(255,238,190,0.8)'); gr.addColorStop(0.5,'rgba(255,226,170,0.35)'); gr.addColorStop(1,'rgba(255,220,170,0)');
    g.fillStyle=gr; g.fillRect(SUN[0]-SUN_R*4.5,SUN[1]-SUN_R*4.5,SUN_R*9,SUN_R*9);
    for(let i=0;i<70;i++){ const a=R.r(0,TAU), rr=Math.sqrt(R.f())*SUN_R; dab(g,SUN[0]+Math.cos(a)*rr,SUN[1]+Math.sin(a)*rr,R.r(8,16),R.r(5,9),R.r(-20,20)*DEG,R.pick(['#FFFBEA','#FFF7DC','#FFF2CC']),R,{imp:0.15,jit:[2,0.02,0.01]}); }
    for(let i=0;i<26;i++){ const a=R.r(0,TAU); dab(g,SUN[0]+Math.cos(a)*SUN_R,SUN[1]+Math.sin(a)*SUN_R,R.r(7,12),R.r(2.5,4),a+Math.PI/2,R.pick(['#FFD98A','#FFE3A0']),R,{imp:0,alpha:0.8}); }
    paintClouds(P[0],R,K); }
  /* the cloud band: long streaks with rose-lilac bellies and lit tops, warmest near the sun, broken into banks by a noise */
  function paintClouds(g,R,K){ const nz=noise(hash(K.seed,'cloud'));
    for(let i=0;i<2400;i++){ const x=R.r(-0.08,1.08)*LW, yc=(0.18+0.025*nz(x/300,0.5))*LH, th=(0.025+0.02*(nz(x/160,2.5)+1))*LH, y=yc+R.g()*th*0.45;

  /* ---- ridges: the far one pale lilac-blue, the near ones dark blue-green conifer slopes; both fade toward the haze
     colour below their skyline (aerial perspective) and warm up near the sun ---- */
  function paintRidges(g,R,K){ const warm=x=>Math.exp(-Math.pow((x-SUN[0])/(0.2*LW),2));
    const haze=(Q,x,y)=>{ const t=yOn(Q,x); return clamp((y-t)/Math.max(8,Hn*LH-t)); };   // 0 on the skyline, 1 at the water
    const F=toL(FAR);
    paintRegion(g,R,{name:'far',P:under(FAR),base:'#999BBC',len:[18,40],wid:[6,11],flow:x=>12*Math.sin(x/140),angJit:14,cover:2.2,imp:0.3,ridgeP:0.4,br:0.5,brP:0.4,rag:0.3,cluster:60,
      col:(x,y,v)=>mixc(mixc(mixc(C('#8388AE'),C('#ABA7C2'),0.5+0.35*v),C('#E6C6C0'),0.5*haze(F,x,y)),C('#F2CBB0'),0.3*warm(x)),

    for(const [nm,L] of [['nearL',NEAR_L],['nearR',NEAR_R]]){ const Q=toL(L);
      paintRegion(g,R,{name:nm,P:under(L),base:'#3A5250',len:[10,22],wid:[4,8],flow:-90,angJit:10,cover:2.8,imp:0.4,ridgeP:0.5,br:0.4,brP:0.4,rag:0.3,cluster:40,
        col:(x,y,v)=>mixc(mixc(C('#2D4644'),C('#4A635C'),0.5+0.45*v),C('#9A8FA0'),0.4*haze(Q,x,y)),
        accents:{share:0.05,len:[8,18],wid:[1.5,3],dl:-0.12},lights:{share:0.03,len:[6,12],wid:[1.5,3],col:()=>R.pick(['#9A8C62','#A89A6A','#7D8A66'])}},K.seed);
      for(let i=0;i<Q.length-1;i++) for(let k=0;k<14;k++){ const u=R.f(), x=lerp(Q[i][0],Q[i+1][0],u), y=lerp(Q[i][1],Q[i+1][1],u);   // conifer tips on the skyline
        dab(g,x,y-R.r(2,8),R.r(12,22),R.r(3,5),-90*DEG+R.r(-0.1,0.1),R.pick(['#2C4441','#355049','#3E5A55']),R,{imp:0.3,taper:[1,0.7,0.15]}); } }
    for(let i=0;i<420;i++) dab(g,R.r(-0.02,1.02)*LW,(Hn+R.r(-0.003,0.003))*LH,R.r(10,26),R.r(2,4),R.r(-6,6)*DEG,R.pick(['#4A4A5E','#56526A','#3F4556']),R,{imp:0,alpha:0.85}); }   // the shore line

  /* ---- the lake: the sky and the ridges drawn flipped about the shore line, darker and bluer toward the viewer, then
     repainted as horizontal marks whose colours are read from that mirror (getImageData, only while building); ripple
     streaks and a gold path under the sun. A painted reflection, not a photo flip ---- */
  const lakeRect=()=>[-0.04*LW,(Hn-0.004)*LH,1.08*LW,(1.004-Hn)*LH+2];
  function paintLake(g,R,K){ const r=lakeRect(), y0=Hn*LH, s=g.getTransform().a, nr=noise(hash(K.seed,'ripple'));
    g.fillStyle='#35667A'; g.fillRect(r[0],r[1],r[2],r[3]);

      for(let x=r[0]-R.r(0,40);x<r[0]+r[2];){ const len=R.r(24,70)*p, px=x+R.r(-6,6), py=y+R.r(-0.5,0.5)*dy;

    for(let i=0;i<2600;i++){ const yy=R.r(y0+4,LH), p=persp(yy), xx=R.r(r[0],r[0]+r[2]), light=R.f()<0.5;   // ripple streaks: pale lines, dark troughs
      if(R.f()<0.5*(1-depth(yy))) continue;

  /* alive: the cached lake drawn in strips of 3-9 px (thinner at the shore), each shifted sideways by a smooth noise of
     (y, tau) that grows toward the viewer; a strip overlaps the next by a device row so no seam opens. At tau 0 nothing
     runs and the static layer shows, so the still is unchanged */

  const GLITS=new Map();
  function glitterSet(K){ const key=K.seed+'|'+PAINT_V; let G=GLITS.get(key); if(G) return G; const R=rng(hash(K.seed,'glit')), y0=Hn*LH; G=[];
    for(let i=0;i<340;i++){ const yy=R.r(y0+3,LH-10), sig=(0.010+0.05*Math.pow(depth(yy),0.8))*LW, p=persp(yy);
      G.push({x:SUN[0]+R.g()*sig*0.9,y:yy,l:R.r(8,24)*p,w:R.r(1.4,3)*p,ph:R.r(0,100),per:R.r(0.7,1.5),col:css(C(R.pick(['#FFF0C8','#FFE4A6','#FFF6DA'])))}); }
    GLITS.set(key,G); return G; }
  function glitterDraw(g,K,tau,life){ const ng=noise(hash(K.seed,'glitt'));
    for(const q of glitterSet(K)){ const a=life*sstep(0.25,0.75,ng(tau/q.per+q.ph,q.ph*0.37)); if(a<0.03) continue;
      g.globalAlpha=a; dabFast(g,q.x+0.75*tau*persp(q.y),q.y,q.l,q.w,0,0,[0.3,1,0.3],q.col); }
    g.globalAlpha=1; }

  /* ---- reeds: a dense back mass of short dark blades on an olive bank (cached) and tall front reeds drawn every frame,
     bending with the page's gust as it travels right to left at 700 px/s ---- */
  const REED_PAL=['#8C8A3E','#B59A55','#6E7034','#9E8E48','#C4A763','#5E6430'];
  const reedP=y=>0.6+0.8*clamp((y/LH-0.8)/0.2);                                     // reed size: larger toward the viewer
  function paintBank(g,R,K){ const nb=noise(hash(K.seed,'bank'));
    for(let i=0;i<2600;i++){ const x=R.r(-0.02,1.02)*LW, y=R.r(0.80,1.04)*LH; if(y<reedTop(x)+18) continue;
      dab(g,x,y,R.r(12,30),R.r(5,10),R.r(-25,25)*DEG,R.pick(['#3E4420','#4A4E24','#343A1C','#565A2A']),R,{imp:0.4,ridgeP:0.4}); }
    for(let i=0;i<3400;i++){ const x=R.r(-0.02,1.02)*LW, y=R.r(0.78,1.04)*LH; if(y<reedTop(x)) continue; const p=reedP(y);
      blade(g,x,y,R.r(30,90)*p,R.r(2.5,5)*p,(-90+R.r(-18,18)+6*nb(x/100,y/100))*DEG,R.r(-10,16)*DEG,jit(R.pick(['#4E5528','#5E6430','#6E7034','#7A7438','#3F4722']),R),{lit:R.f()<0.3?'#B8A15C':null,litA:0.5}); } }
  function reedList(K){ const R=rng(hash(K.seed,'reeds',PAINT_V)), nl=noise(hash(K.seed,'reedlean')), out=[];
    for(let i=0;i<900;i++){ const x=R.r(-0.02,1.02)*LW, y=R.r(0.80,1.04)*LH; if(y<reedTop(x)) continue; const p=reedP(y), tall=R.f()<0.2;
      out.push({x,y,len:(tall?R.r(150,250):R.r(50,130))*p,w:R.r(2.5,5.5)*p,a:(-85+R.r(-14,14)+10*nl(x/160,0.5))*DEG,b:R.r(-6,24)*DEG,
        col:jit(R.pick(REED_PAL),R),lit:R.f()<0.45?R.pick(['#E2CB86','#F0D89A']):null,m:R.r(0.7,1.2),ph:R.r(0,50)}); }
    return out.sort((a,b)=>a.y-b.y); }                                                // far to near: nearer blades cover farther ones
  function drawReeds(g,K,tau,life,t){ const nj=noise(hash(K.seed,'reedj'));
    for(const r of K.reeds){ const w=life*(gust(t-(LW-r.x)/700,K.seed)*0.055+0.02*nj(t/0.7,r.ph))*r.m;   // at life 0 every blade is at rest
      blade(g,r.x,r.y,r.len,r.w,r.a+w*0.6,r.b+w,r.col,{lit:r.lit,litA:0.55,tip:0.15}); } }

  S.prepare=K=>{ K.reeds=reedList(K); };
  /* the drawing: a pencil gain per region, lighter on the water than in the sky, the land and the reeds */
  S.pencil={ v:1, blur:2, gain:(x,y)=>{ const ny=y/LH; if(ny<0.28) return 1.28; if(ny<Hn+0.01) return 1.25; return y>reedTop(x)?1.3:1.08; } };
  /* the first ink: a few drips along the top edge (the top band 3.5 f early, gated in x by a noise); below it the paper waits until about f10 */
  S.reveal={ v:1, sketch:{top:[3.5,0.06,0.05,0.05,0.3], lo:[8.5,6.5,100,0.04,3.5]} };
  S.layers=[
    {name:'sky',    rect:()=>[-0.04*LW,0,1.08*LW,(Hn+0.01)*LH], paint:paintSky, parts:[{rect:()=>[-0.1*LW,0.08*LH,1.2*LW,0.22*LH],drift:tau=>[3*tau,0]}]},   // clouds: 3 px/s
    {name:'ridges', rect:()=>[-0.02*LW,0.26*LH,1.04*LW,(Hn-0.25)*LH], paint:paintRidges},
    {name:'lake',   rect:lakeRect, paint:paintLake, alpha:tau=>tau>0?0:1, live:lakeLive},   // alive, the static layer hides and live() draws the strips
    {name:'bank',   rect:()=>[-0.02*LW,0.62*LH,1.04*LW,0.40*LH], paint:paintBank},
    {name:'reeds',  live:drawReeds},
  ];
  return S;
})();
/* ===== end scene ===== */

/* =====================================================================
   ENGINE
   ===================================================================== */
const PLATES=[];
/* plate(name, {len, cutIn, cutOut}, fn). len in frames, keep it a multiple of BEAT.
   fn(S,R): S.t 0..1 progress, S.i local frame, S.f global frame, S.len, S.g context (logical coords),
   S.b generator re-seeded every 3 frames (live line), S.nz generator per frame (noise),
   R generator stable for the whole plate (composition). Seeds derive from the plate NAME, so
   inserting a plate never changes its neighbours. */
function plate(name,opts,fn){ if(PLATES.some(p=>p.name===name)) console.warn(`duplicate plate name: ${name}`); PLATES.push(Object.assign({name,fn},opts)); }
function TOTAL(){ return PLATES.reduce((a,p)=>a+p.len,0); }
function locate(n){ let acc=0; for(let i=0;i<PLATES.length;i++){ if(n<acc+PLATES[i].len) return {idx:i,local:n-acc}; acc+=PLATES[i].len; } const i=PLATES.length-1; return {idx:i,local:PLATES[i].len-1}; }
/* at(name, x): the global frame of beat x of plate `name`, rounded to a whole frame (x=0: its first frame).
   For what carries on across cuts (an island that grows through three plates): span(S.f, at('sea'), at('city',4)).
   Call it while drawing, not at the top level: the plates below are not registered yet. */
function at(name,x=0){ let acc=0; for(const p of PLATES){ if(p.name===name) return Math.round(acc+x*BEAT); acc+=p.len; } throw new Error(`at(): no plate named ${name}`); }
/* cue(name): the frame of a moment in CUES, the table the picture and the sound share (RISO.curves() exports it) */
function cue(name){ const c=CUES.find(c=>c[2]===name); if(!c) throw new Error(`cue(): no cue named ${name}`); return at(c[0],c[1]); }

/* transition drawn by the engine at plate edges; a painting film is one shot: every plate sets cutIn:false and cutOut:false */
function cut(g,S,amt){ g.save(); g.setTransform(1,0,0,1,0,0); g.fillStyle=`rgba(0,0,0,${amt})`; g.fillRect(0,0,g.canvas.width,g.canvas.height); g.restore(); }   // in pixels: every row, at any width

function renderFrame(n,width,seed,target){
  n=((n%TOTAL())+TOTAL())%TOTAL();
  const W=Math.round(width); let H=Math.round(W/AR); if(H%2) H++;   // even height for libx264
  const cv=cvs('content',W,H), g=wipe(cv.getContext('2d')), sc=W/LW;   // a clean context every frame
  const {idx,local}=locate(n), P=PLATES[idx];
  const S={ f:n, i:local, t:local/P.len, len:P.len, g, cv, sc, seed, W:LW, H:LH, name:P.name, post:{},
            b:rng(hash(seed,'b',P.name,Math.floor(n/3))), nz:rng(hash(seed,'nz',n)) };
  const R=rng(hash(seed,'plate',P.name));
  g.fillStyle=COL.bg; g.fillRect(0,0,W,H);                   // in pixels, before the scale: LH*sc can fall short of the even H (853.33 of 854 rows in 9:16 at 480)
  g.setTransform(sc,0,0,sc,0,0); g.imageSmoothingEnabled=true;
  P.fn(S,R);
  const edgeIn=local, edgeOut=P.len-1-local;
  if(P.cutIn!==false && edgeIn<3) cut(g,S,1-edgeIn/3);
  else if(P.cutOut!==false && edgeOut<2) cut(g,S,1-edgeOut/2);
  g.setTransform(1,0,0,1,0,0);
  if(target.width!==W||target.height!==H){ target.width=W; target.height=H; }
  post(cv,target,S,S.post);
  return S;
}

function contactSheet(n,cellW,seed,target,f0=0,f1=TOTAL()-1){   // f0..f1: a sheet of one section
  const cols=AR>=1?6:8, rows=Math.ceil(n/cols), cellH=Math.round(cellW/AR), lab=26, gap=8;
  const SW=cols*(cellW+gap)+gap, SH=rows*(cellH+lab+gap)+gap;
  target.width=SW; target.height=SH; const g=target.getContext('2d');
  g.fillStyle='#181818'; g.fillRect(0,0,SW,SH);
  const tmp=cvs('cell',cellW*2,Math.round(cellW*2/AR));     // render at 2x, downscale: post-processing stays honest
  for(let i=0;i<n;i++){
    const f=n>1?Math.round(f0+i*(f1-f0)/(n-1)):f0;
    const S=renderFrame(f,cellW*2,seed,tmp);
    const x=gap+(i%cols)*(cellW+gap), y=gap+Math.floor(i/cols)*(cellH+lab+gap);
    g.drawImage(tmp,x,y,cellW,cellH);
    g.fillStyle='#ddd'; g.font='12px Menlo, monospace'; g.textBaseline='top';
    g.fillText(`f=${f}  ${S.name}  t=${S.t.toFixed(2)}  ${(f/FPS).toFixed(1)}s`,x+2,y+cellH+6);
  }
}

/* =====================================================================
   PLATES. One shot in three chapters of time; every plate draws the same painting. Lengths are multiples of BEAT.
   ===================================================================== */

/* moments the picture and the sound share: [plate, beat, name], beats counted from the plate's start.
   A plate reads one with cue(name); RISO.curves() exports them and audio.mjs puts its hits on the same frames.
   The painting kit reads wash, finish, step, done, alive and push; its REVEAL defaults are tuned for these frames. */
const CUES=[
  ['sketch',0.4,'marks'],       // f6   the first pencil islands along the top edge
  ['colour',0,'wash'],          // f60  colour blooms start, bottom first
  ['colour',13/15,'finish'],    // f73  the colour finishes from 0.65 toward 1
  ['colour',27/15,'step'],      // f87  a one-frame step of +0.10
  ['colour',38/15,'done'],      // f98  paint complete: the still
  ['alive',0,'alive'],          // f105 life ramps in
  ['alive',1/3,'push'],         // f110 the camera push-in starts
];

plate('sketch',{len:4*BEAT, cutIn:false, cutOut:false},(S)=>drawPainting(S));   // paper, then the drawing
plate('colour',{len:3*BEAT, cutIn:false, cutOut:false},(S)=>drawPainting(S));   // the colour washes in and finishes
plate('alive', {len:17*BEAT, cutIn:false, cutOut:false},(S)=>drawPainting(S));  // the still settles, comes alive, the camera pushes in

/* =====================================================================
   BOOT
   ===================================================================== */
const MAIN=document.getElementById('c'); MAIN.getContext('2d',{willReadFrequently:true});   // read back every frame: keep it on the CPU
window.RISO={
  fps:FPS,
  get total(){ return TOTAL(); },
  get plates(){ return PLATES.map(p=>({name:p.name,len:p.len})); },
  frame(n,width,seed){ renderFrame(n,width??WIDTH,seed??SEED,MAIN); return MAIN.toDataURL('image/png'); },
  contact(n,cellW,f0,f1){ contactSheet(n||24,cellW||480,SEED,MAIN,f0??0,f1??TOTAL()-1); return MAIN.toDataURL('image/png'); },
  // plate starts for the soundtrack (scripts/export-curves.mjs -> curves.json -> audio.mjs builds its T table from it).
  // frames: paintingCurves(seed), per frame the revealed share of the drawing and of the colour, life, gust and camera zoom
  // (plus the scene's own fields). cues: the CUES table as {name, plate, beat, f}, f the frame the picture shows it on.
  curves(seed){ const start={}; let acc=0; for(const p of PLATES){ start[p.name]=acc; acc+=p.len; }
    return {fps:FPS,bpm:BPM,total:acc,start,frames:paintingCurves(seed??SEED),cues:CUES.map(([plate,beat,name])=>{ if(!PLATES.some(p=>p.name===plate)) throw new Error(`CUES row ${name}: no plate named ${plate}`);
      return {name,plate,beat,f:at(plate,beat)}; })}; }
};
window.addEventListener('load',()=>{
  if(Q.has('grid')){ contactSheet(+Q.get('grid')||24,+Q.get('cw')||480,SEED,MAIN,+(Q.get('from')||0),Q.has('to')?+Q.get('to'):TOTAL()-1); window.__ready=true; }
  else if(Q.has('f')){ renderFrame(+Q.get('f')||0,WIDTH,SEED,MAIN); window.__ready=true; }
  else { let f=+(Q.get('from')||0), last=0;
    const tick=(ts)=>{ if(ts-last>=1000/FPS){ last=ts; renderFrame(f++,Math.min(WIDTH,960),SEED,MAIN); } requestAnimationFrame(tick); };
    requestAnimationFrame(tick); window.__ready=true; }
});
</script>
</body>
